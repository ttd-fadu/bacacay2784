<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Proyecto</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f4f4f2;color:#0a0a0a;min-height:100vh}
:root{--klein:#002FA7;--terra:#9E3A26;--border:#e0e0dc;--gray:#f4f4f2}

.topbar{background:var(--klein);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--terra);position:sticky;top:0;z-index:200}
.topbar-left{display:flex;align-items:center;gap:1rem}
.topbar-brand{font-size:.92rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.topbar-sep{color:rgba(255,255,255,.25);font-size:.9rem}
.topbar-project{font-size:.82rem;font-weight:700;color:rgba(255,255,255,.85)}
.topbar-right{display:flex;align-items:center;gap:.6rem}
.btn-sm{padding:.38rem .85rem;font-size:.6rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.btn-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}.btn-ghost:hover{background:rgba(255,255,255,.2);color:#fff}
.btn-terra{background:var(--terra);color:#fff}.btn-terra:hover{opacity:.85}

.main-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 52px)}

/* TABS */
.sidebar{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.stab{flex:1;padding:.75rem .5rem;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:center;cursor:pointer;border:none;background:transparent;color:#888;transition:all .2s;border-bottom:2px solid transparent}
.stab.active{color:var(--klein);border-bottom-color:var(--klein);background:#fff}
.stab:hover{color:var(--klein)}
.sidebar-panel{display:none;flex-direction:column;flex:1}
.sidebar-panel.active{display:flex}
.btn-new{display:block;width:100%;padding:.8rem;text-align:center;background:var(--terra);color:#fff;font-size:.62rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;flex-shrink:0}
.btn-new:hover{background:#7a2d1e}
.sidebar-inner{padding:1.25rem;flex:1;overflow-y:auto}
.sidebar-label{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;font-weight:700;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid #eee}
.rlist{list-style:none}
.rli{padding:.65rem .8rem;cursor:pointer;border-radius:3px;transition:background .15s;margin-bottom:.15rem}
.rli:hover{background:var(--gray)}
.rli.active{background:var(--klein);color:#fff}
.rli.active .rli-num{color:#ffd060}
.rli-num{font-size:.58rem;font-weight:700;letter-spacing:.1em;color:var(--terra)}
.rli-title{font-size:.8rem;font-weight:700}
.rli-date{font-size:.56rem;color:#888}
.rli.active .rli-date{color:rgba(255,255,255,.45)}
.rli-actions{display:none;gap:.25rem;margin-top:.25rem}
.rli:hover .rli-actions,.rli.active .rli-actions{display:flex}
.btn-del-r{padding:.12rem .35rem;background:rgba(158,58,38,.1);border:none;cursor:pointer;font-size:.56rem;color:var(--terra);border-radius:2px;font-weight:700;transition:all .2s}
.btn-del-r:hover{background:var(--terra);color:#fff}

/* VERSION LIST */
.vli{padding:.65rem .8rem;cursor:pointer;border-radius:3px;transition:background .15s;margin-bottom:.15rem;display:flex;justify-content:space-between;align-items:center}
.vli:hover{background:var(--gray)}
.vli.active{background:var(--klein);color:#fff}
.vli-label{font-size:.78rem;font-weight:700}
.vli-date{font-size:.54rem;color:#888}
.vli.active .vli-date{color:rgba(255,255,255,.45)}
.badge-current{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--terra);color:#fff;padding:.1rem .35rem;border-radius:2px}

/* CONTENT */
.content{padding:2rem 2.5rem;max-width:900px;overflow-y:auto}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid #d0d0cc;flex-wrap:wrap;gap:1rem}
.content-title{font-size:1.35rem;font-weight:700}
.content-sub{font-size:.68rem;color:#888;margin-top:.2rem}
.content-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.fs{background:#fff;padding:1.5rem;margin-bottom:1.25rem;border:1px solid var(--border)}
.fs-title{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem;color:#0a0a0a}
.fs-title::after{content:'';flex:1;height:1px;background:#eee}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.field-col{margin-bottom:1.25rem}
.fl{display:block;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.35rem}
.fi{width:100%;padding:.62rem .8rem;background:#fff;border:1px solid #d0d0cc;color:#0a0a0a;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--klein)}

/* PROGRESO */
.prog-item{background:#f9f9f7;border:1px solid #e8e8e4;padding:1rem;margin-bottom:.75rem}
.prog-item-header{display:grid;grid-template-columns:1fr 70px 32px;gap:.75rem;align-items:center;margin-bottom:.6rem}
.prog-slider{-webkit-appearance:none;width:100%;height:4px;background:#d0d0cc;outline:none;cursor:pointer;margin-bottom:.5rem}
.prog-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--terra);border-radius:50%;cursor:pointer}
.prog-pct{font-size:1.1rem;font-weight:700;text-align:right}
.btn-remove{width:32px;height:32px;background:#fff;border:1px solid #d0d0cc;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-remove:hover{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.btn-add{padding:.5rem 1rem;background:transparent;border:1px solid #d0d0cc;font-size:.62rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:.5rem}
.btn-add:hover{border-color:var(--klein);background:var(--klein);color:#fff}

/* NOVEDADES */
.nov-item{display:grid;grid-template-columns:130px 1fr 32px;gap:.6rem;align-items:start;margin-bottom:.6rem}

/* FOTOS */
.drop-zone{border:2px dashed #d0d0cc;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem}
.drop-zone:hover,.drop-zone.over{border-color:var(--klein);background:#f0f4ff}
.drop-label{font-size:.78rem;color:#888}
.drop-label strong{color:#0a0a0a}
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.75rem}
.foto-card{position:relative;background:#f4f4f2;border:1px solid var(--border)}
.foto-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto-card-overlay{position:absolute;top:.4rem;right:.4rem}
.btn-del{background:rgba(255,107,107,.9);color:#fff;border:none;padding:.25rem .5rem;font-size:.58rem;font-weight:700;cursor:pointer}
.foto-caption{width:100%;padding:.35rem .4rem;font-size:.6rem;border:none;border-top:1px solid var(--border);background:#fff;font-family:inherit;outline:none}
.pb{height:3px;background:#d0d0cc;margin:.5rem 0;display:none;overflow:hidden}
.pb-fill{height:100%;background:var(--terra);width:0;transition:width .2s}

/* FIN */
.fin-item{display:grid;grid-template-columns:1fr 130px auto 32px;gap:.6rem;align-items:center;margin-bottom:.6rem}
.cb-label{display:flex;align-items:center;gap:.35rem;font-size:.75rem;cursor:pointer;white-space:nowrap}
.cb-label input{accent-color:var(--terra)}

/* IMG PREVIEW */
.img-prev-sm{width:100%;max-height:140px;object-fit:cover;display:block;border:1px solid var(--border);margin-bottom:.5rem}

/* PRESENTACION */
.pres-section-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.pres-img-card{position:relative;background:#f4f4f2;border:1px solid var(--border)}
.pres-img-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pres-img-overlay{position:absolute;top:.4rem;right:.4rem}
.pres-caption{width:100%;padding:.35rem .4rem;font-size:.6rem;border:none;border-top:1px solid var(--border);background:#fff;font-family:inherit;outline:none}
.version-badge{display:inline-block;background:var(--terra);color:#fff;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.2rem .5rem;margin-bottom:.75rem}
.version-readonly{background:#f9f9f7;border:1px solid var(--border);padding:1rem;margin-bottom:.75rem;font-size:.82rem;color:#555;font-style:italic}

/* PREVIEW MODAL */
#preview-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;flex-direction:column}
#preview-modal.open{display:flex}
.preview-topbar{background:#0a0a0a;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--terra);flex-shrink:0}
.preview-topbar-title{color:var(--terra);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
#preview-body{flex:1;overflow-y:auto;background:#fafafa;padding:2rem}
#preview-inner{max-width:860px;margin:0 auto}

/* PUB OVERLAY */
#pub-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.75);z-index:500;align-items:center;justify-content:center}
#pub-overlay.show{display:flex}
.pub-box{background:#fff;padding:2.5rem 3rem;text-align:center;border-top:3px solid var(--terra);min-width:240px}
.pub-spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--terra);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.pub-msg{font-size:.8rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase}

.toast{position:fixed;bottom:2rem;right:2rem;background:#0a0a0a;color:#fff;padding:.9rem 1.5rem;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border-left:3px solid var(--terra);opacity:0;transform:translateY(8px);transition:all .3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:860px){.main-layout{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}.fotos-grid,.pres-section-grid{grid-template-columns:repeat(2,1fr)}.fin-item{grid-template-columns:1fr 110px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-brand">espacio humo</div>
    <span class="topbar-sep">/</span>
    <span class="topbar-project" id="topbar-project">Cargando...</span>
  </div>
  <div class="topbar-right">
    <button class="btn-sm btn-ghost" onclick="goBack()">Proyectos</button>
    <a id="view-link" href="#" class="btn-sm btn-ghost" target="_blank" onclick="openClientView(event)">Ver como cliente</a>
    <button class="btn-sm btn-ghost" onclick="doLogout()">Salir</button>
  </div>
</div>

<div class="main-layout">
  <aside class="sidebar">
    <div class="sidebar-tabs">
      <button class="stab active" id="tab-informes" onclick="switchTab('informes')">Informes</button>
      <button class="stab" id="tab-presentacion" onclick="switchTab('presentacion')">Proyecto</button>
    </div>

    <!-- PANEL INFORMES -->
    <div class="sidebar-panel active" id="panel-informes">
      <button class="btn-new" onclick="newReport()">+ Nuevo informe</button>
      <div class="sidebar-inner">
        <div class="sidebar-label">Informes publicados</div>
        <ul class="rlist" id="report-list"></ul>
      </div>
    </div>

    <!-- PANEL PRESENTACION -->
    <div class="sidebar-panel" id="panel-presentacion">
      <button class="btn-new" onclick="newVersion()">+ Nueva version</button>
      <div class="sidebar-inner">
        <div class="sidebar-label">Versiones</div>
        <ul class="rlist" id="version-list"></ul>
      </div>
    </div>
  </aside>

  <main class="content" id="content">
    <div style="text-align:center;padding:4rem 0;color:#aaa">
      <div style="font-size:.88rem">Selecciona un informe o crea uno nuevo</div>
    </div>
  </main>
</div>

<div id="preview-modal">
  <div class="preview-topbar">
    <span class="preview-topbar-title">Vista previa — como lo ve el cliente</span>
    <div style="display:flex;gap:.6rem">
      <button class="btn-sm btn-terra" onclick="publishFromPreview()">Publicar</button>
      <button class="btn-sm btn-ghost" onclick="closePreview()">Cerrar</button>
    </div>
  </div>
  <div id="preview-body"><div id="preview-inner"></div></div>
</div>

<div id="pub-overlay">
  <div class="pub-box">
    <div class="pub-spinner"></div>
    <div class="pub-msg" id="pub-msg">Publicando...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db   = firebase.firestore();
const auth  = firebase.auth();

const urlParams  = new URLSearchParams(window.location.search);
const PROJECT_ID = urlParams.get('id');

let project      = null;
let allReports   = [];
let allVersions  = [];
let currentId    = null;
let currentVerId = null;
let currentFotos = [];
let currentRenders = [];
let currentPlanos  = [];
let currentHeroB64 = null;
let currentAxoB64  = null;
let pendingData  = null;
let activeTab    = 'informes';
let progCount=0,novCount=0,finCount=0;

auth.onAuthStateChanged(async user => {
  if(!user){ window.location.href='admin.html'; return; }
  if(!PROJECT_ID){ window.location.href='admin.html'; return; }
  await loadProject();
});

function doLogout(){ auth.signOut().then(()=>{ window.location.replace('admin.html'); }); }

// ── PROJECT ───────────────────────────────────────────────────────────────────
async function loadProject(){
  try{
    const doc = await db.collection('projects').doc(PROJECT_ID).get();
    if(!doc.exists){ alert('Proyecto no encontrado'); return; }
    project = {id:doc.id,...doc.data()};
    document.getElementById('topbar-project').textContent = project.nombre||'Proyecto';
    document.title = 'Admin — '+(project.nombre||'Proyecto');
    await Promise.all([loadReports(), loadVersions()]);
  }catch(e){ toast('Error: '+e.message); }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab){
  activeTab = tab;
  document.getElementById('tab-informes').classList.toggle('active', tab==='informes');
  document.getElementById('tab-presentacion').classList.toggle('active', tab==='presentacion');
  document.getElementById('panel-informes').classList.toggle('active', tab==='informes');
  document.getElementById('panel-presentacion').classList.toggle('active', tab==='presentacion');
  document.getElementById('content').innerHTML = '<div style="text-align:center;padding:4rem 0;color:#aaa"><div style="font-size:.88rem">Selecciona un elemento o crea uno nuevo</div></div>';
  currentId = null; currentVerId = null;
}

// ── REPORTS ───────────────────────────────────────────────────────────────────
async function loadReports(){
  const snap = await db.collection('projects').doc(PROJECT_ID)
    .collection('reports').orderBy('createdAt','asc').get();
  allReports = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderReportList();
  if(allReports.length && activeTab==='informes') selectReport(allReports[allReports.length-1].id);
}

function renderReportList(){
  document.getElementById('report-list').innerHTML = allReports.map(r=>`
    <li class="rli ${r.id===currentId?'active':''}" onclick="selectReport('${r.id}')">
      <div class="rli-num">#${String(r.numero||0).padStart(3,'0')}</div>
      <div class="rli-title">${esc(r.titulo||'Sin titulo')}</div>
      <div class="rli-date">${esc(r.fecha||'Sin fecha')}</div>
      <div class="rli-actions">
        <button class="btn-del-r" onclick="event.stopPropagation();deleteReport('${r.id}','${esc(r.titulo||'')}')">Eliminar</button>
      </div>
    </li>`).join('');
}

async function selectReport(id){
  currentId=id; renderReportList();
  const r=allReports.find(x=>x.id===id);
  currentFotos=[];
  try{
    const fs=await db.collection('projects').doc(PROJECT_ID)
      .collection('reports').doc(id).collection('fotos').orderBy('order','asc').get();
    fs.docs.forEach(d=>currentFotos.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false}));
  }catch(e){}
  currentHeroB64=r.heroB64||null;
  currentAxoB64=r.axoB64||null;
  renderReportForm(r);
}

async function newReport(){
  const last=allReports.length?allReports[allReports.length-1]:null;
  const num=last?(last.numero||0)+1:0;
  const draft={
    numero:num,titulo:`Informe N ${num}`,fecha:'',etapa:last?.etapa||'',
    pctGlobal:last?.pctGlobal||0,
    clima:{texto:'Dias lluvia: 0',sub:'Sin impacto'},
    progreso:last?.progreso?last.progreso.map(p=>({...p})):[
      {nombre:'Tareas Preliminares',val:0,nota:''},
      {nombre:'Estructura',val:0,nota:''},
      {nombre:'Albanileria',val:0,nota:''},
      {nombre:'Instalaciones',val:0,nota:''},
    ],
    galeriaTitle:'Lo que esta sucediendo en obra',
    novedades:[{fecha:'',texto:''}],
    financiero:last?.financiero?JSON.parse(JSON.stringify(last.financiero)):
      {pagadoPct:0,pagado:'$0',pendiente:'$0',total:'$0',items:[],hito:''},
    proximoInforme:'',heroB64:null,axoB64:null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  };
  const ref=await db.collection('projects').doc(PROJECT_ID).collection('reports').add(draft);
  draft.id=ref.id;
  allReports.push(draft);
  currentFotos=[];currentHeroB64=null;currentAxoB64=null;
  currentId=ref.id;
  renderReportList();renderReportForm(draft);
  await db.collection('projects').doc(PROJECT_ID).update({informeCount:allReports.length});
  toast('Nuevo informe creado');
}

async function deleteReport(id,titulo){
  if(!confirm('Eliminar "'+titulo+'"?\n\nEsta accion no se puede deshacer.')) return;
  try{
    const fs=await db.collection('projects').doc(PROJECT_ID)
      .collection('reports').doc(id).collection('fotos').get();
    const batch=db.batch();
    fs.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    await db.collection('projects').doc(PROJECT_ID).collection('reports').doc(id).delete();
    allReports=allReports.filter(r=>r.id!==id);
    if(currentId===id){ currentId=null; document.getElementById('content').innerHTML='<div style="text-align:center;padding:4rem 0;color:#aaa"><div style="font-size:.88rem">Selecciona un informe o crea uno nuevo</div></div>'; }
    renderReportList();
    await db.collection('projects').doc(PROJECT_ID).update({informeCount:allReports.length});
    toast('Informe eliminado');
  }catch(e){toast('Error: '+e.message);}
}

// ── VERSIONS (PRESENTACION) ───────────────────────────────────────────────────
async function loadVersions(){
  const snap = await db.collection('projects').doc(PROJECT_ID)
    .collection('versions').orderBy('createdAt','desc').get();
  allVersions = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderVersionList();
}

function renderVersionList(){
  const list = document.getElementById('version-list');
  if(!allVersions.length){
    list.innerHTML='<li style="padding:.75rem;font-size:.72rem;color:#aaa">Sin versiones aun</li>';
    return;
  }
  list.innerHTML = allVersions.map((v,i)=>`
    <li class="vli ${v.id===currentVerId?'active':''}" onclick="selectVersion('${v.id}')">
      <div>
        <div class="vli-label">${esc(v.titulo||'Version')}</div>
        <div class="vli-date">${esc(v.fecha||'')}</div>
      </div>
      ${i===0?'<span class="badge-current">Actual</span>':''}
    </li>`).join('');
}

async function selectVersion(id){
  currentVerId=id; renderVersionList();
  const v=allVersions.find(x=>x.id===id);
  currentRenders=[]; currentPlanos=[];
  try{
    const rs=await db.collection('projects').doc(PROJECT_ID)
      .collection('versions').doc(id).collection('renders').orderBy('order','asc').get();
    rs.docs.forEach(d=>currentRenders.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false}));
    const ps=await db.collection('projects').doc(PROJECT_ID)
      .collection('versions').doc(id).collection('planos').orderBy('order','asc').get();
    ps.docs.forEach(d=>currentPlanos.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false}));
  }catch(e){}
  renderVersionForm(v);
}

async function newVersion(){
  const num=allVersions.length+1;
  const draft={
    titulo:`Version ${num}`,
    fecha:'',
    etapa:'Anteproyecto — Primera revision',
    descripcion:'',
    memoria:'',
    computo:'',
    isCurrent:true,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  };
  const ref=await db.collection('projects').doc(PROJECT_ID).collection('versions').add(draft);
  draft.id=ref.id;
  allVersions.unshift(draft);
  currentRenders=[]; currentPlanos=[];
  currentVerId=ref.id;
  renderVersionList();renderVersionForm(draft);
  toast('Nueva version creada');
}

// ── REPORT FORM ───────────────────────────────────────────────────────────────
function renderReportForm(r){
  progCount=0;novCount=0;finCount=0;

// ── FOTOS ─────────────────────────────────────────────────────────────────────
function handleDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('over');handleFotoFiles(e.dataTransfer.files);}
async function handleFotoFiles(files){
  const arr=Array.from(files);if(!arr.length)return;
  const bar=document.getElementById('foto-bar'),fill=document.getElementById('foto-fill');
  bar.style.display='block';
  for(let i=0;i<arr.length;i++){
    fill.style.width=((i/arr.length)*90)+'%';
    const c=await compressImage(arr[i],1000,78);
    currentFotos.push({id:null,src:c,caption:arr[i].name.replace(/\.[^.]+$/,''),order:currentFotos.length,isNew:true,toDelete:false});
    renderFotosGrid();
  }
  fill.style.width='100%';
  setTimeout(()=>{bar.style.display='none';fill.style.width='0';},500);
  toast(arr.length+' foto'+(arr.length>1?'s':'')+' lista'+(arr.length>1?'s':'')+' para publicar');
}
function renderFotosGrid(){
  const grid=document.getElementById('fotos-grid');if(!grid)return;
  const vis=currentFotos.filter(f=>!f.toDelete);
  grid.innerHTML=vis.map((f,vi)=>{const ri=currentFotos.indexOf(f);return `<div class="foto-card"><img src="${f.src}" alt="${esc(f.caption)}"/><div class="foto-card-overlay"><button class="btn-del" onclick="removeFoto(${ri})">x</button></div><input class="foto-caption" id="fc-${ri}" value="${esc(f.caption)}" placeholder="Caption"/></div>`;}).join('');
}
function removeFoto(i){if(currentFotos[i].id){currentFotos[i].toDelete=true;}else{currentFotos.splice(i,1);}renderFotosGrid();}

// ── COMPRESS ──────────────────────────────────────────────────────────────────
function compressImage(file,maxW,q){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const r=Math.min(maxW/img.width,1),c=document.createElement('canvas');
      c.width=img.width*r;c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',q/100));
    };img.src=url;
  });
}

// ── COLLECT DATA ──────────────────────────────────────────────────────────────
function collectData(){
  currentFotos.forEach((f,i)=>{const el=document.getElementById('fc-'+i);if(el)f.caption=el.value;});
  const progreso=[];document.querySelectorAll('[id^="pi-"]').forEach(row=>{const i=row.id.replace('pi-','');progreso.push({nombre:document.getElementById('p-nom-'+i)?.value||'',val:parseInt(document.getElementById('p-val-'+i)?.value||0),nota:document.getElementById('p-nota-'+i)?.value||''});});
  const novedades=[];document.querySelectorAll('[id^="ni-"]').forEach(row=>{const i=row.id.replace('ni-','');const txt=document.getElementById('nt-'+i)?.value||'';if(txt)novedades.push({fecha:document.getElementById('nf-'+i)?.value||'',texto:txt});});
  const finItems=[];document.querySelectorAll('[id^="fii-"]').forEach(row=>{const i=row.id.replace('fii-','');const lbl=document.getElementById('fi-lbl-'+i)?.value||'';if(lbl)finItems.push({label:lbl,valor:document.getElementById('fi-val-'+i)?.value||'',pagado:document.getElementById('fi-paid-'+i)?.checked||false});});
  return {
    titulo:document.getElementById('f-titulo')?.value||'',
    fecha:document.getElementById('f-fecha')?.value||'',
    etapa:document.getElementById('f-etapa')?.value||'',
    pctGlobal:parseInt(document.getElementById('f-pct')?.value||0),
    clima:{texto:document.getElementById('f-clima-txt')?.value||'',sub:document.getElementById('f-clima-sub')?.value||''},
    superficieTotal:parseInt(document.getElementById('f-sup')?.value||0),
    proximoInforme:document.getElementById('f-proximo')?.value||'',
    galeriaTitle:document.getElementById('f-gal')?.value||'',
    progreso,novedades,fotos:currentFotos,heroB64:currentHeroB64,axoB64:currentAxoB64,
    financiero:{pagadoPct:parseInt(document.getElementById('fin-pct')?.value||0),total:document.getElementById('fin-total')?.value||'',pagado:document.getElementById('fin-pag')?.value||'',pendiente:document.getElementById('fin-pen')?.value||'',hito:document.getElementById('fin-hito')?.value||'',items:finItems},
  };
}

function collectVersionData(){
  currentRenders.forEach((r,i)=>{const el=document.getElementById('rc-'+i);if(el)r.caption=el.value;});
  currentPlanos.forEach((p,i)=>{const el=document.getElementById('pc-'+i);if(el)p.caption=el.value;});
  return {
    titulo:document.getElementById('v-titulo')?.value||'',
    fecha:document.getElementById('v-fecha')?.value||'',
    etapa:document.getElementById('v-etapa')?.value||'',
    descripcion:document.getElementById('v-desc')?.value||'',
    memoria:document.getElementById('v-memoria')?.value||'',
    computo:document.getElementById('v-computo')?.value||'',
  };
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────
function openPreview(){
  pendingData=collectData();const r=pendingData,fin=r.financiero||{};
  const accent=project?.color||'#002FA7';
  const fotosVis=currentFotos.filter(f=>!f.toDelete);
  document.getElementById('preview-inner').innerHTML=`
    <div style="font-family:Helvetica Neue,Helvetica,Arial,sans-serif">
      <div style="position:relative;height:240px;overflow:hidden;margin-bottom:2rem">
        <div style="position:absolute;inset:0;background:url('${r.heroB64||project?.coverB64||''}') center/cover"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,.88),rgba(10,10,10,.25))"></div>
        <div style="position:absolute;bottom:1.5rem;left:2rem;right:2rem;display:flex;justify-content:space-between;align-items:flex-end">
          <div>
            <div style="font-size:.58rem;letter-spacing:.2em;color:${accent};font-weight:700;text-transform:uppercase;margin-bottom:.4rem">${esc(r.titulo)} · ${esc(r.fecha)}</div>
            <div style="font-size:2rem;font-weight:700;color:#fff;line-height:1">${esc(project?.nombre||'')}</div>
            <div style="font-size:.7rem;color:rgba(255,255,255,.45);margin-top:.3rem">${esc(project?.barrio||'')}</div>
          </div>
          <div style="text-align:right"><div style="font-size:3rem;font-weight:700;color:#fff">${r.pctGlobal}<span style="font-size:1.2rem;color:${accent}">%</span></div></div>
        </div>
      </div>
      ${(r.progreso||[]).map(p=>`<div style="margin-bottom:1rem"><div style="display:flex;justify-content:space-between;margin-bottom:.3rem"><span style="font-size:.78rem;font-weight:700;text-transform:uppercase">${esc(p.nombre)}</span><span style="font-size:1.1rem;font-weight:700">${p.val}%</span></div><div style="height:3px;background:#d0d0cc"><div style="height:3px;background:${accent};width:${p.val}%"></div></div><div style="font-size:.56rem;color:#888;margin-top:.2rem">${esc(p.nota)}</div></div>`).join('')}
      ${r.novedades?.length?`<div style="margin:1.5rem 0;border-top:1px solid #eee;padding-top:1.5rem">${r.novedades.map(n=>`<div style="display:flex;gap:1rem;padding:.5rem 0;border-bottom:1px solid #eee"><span style="font-size:.58rem;color:${accent};font-weight:700;min-width:80px">${esc(n.fecha)}</span><span style="font-size:.82rem">${esc(n.texto)}</span></div>`).join('')}</div>`:''}
      ${fotosVis.length?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1.5rem 0">${fotosVis.map(f=>`<img src="${f.src}" style="width:100%;aspect-ratio:4/3;object-fit:cover"/>`).join('')}</div>`:''}
      <div style="margin-top:1.5rem;border-top:1px solid #eee;padding-top:1.5rem">
        <div style="display:flex;gap:2rem;margin-bottom:1rem">
          <div><div style="font-size:1.3rem;font-weight:700;color:${accent}">${esc(fin.pagado)}</div><div style="font-size:.55rem;color:#888;text-transform:uppercase">Pagado</div></div>
          <div><div style="font-size:1.3rem;font-weight:700;color:#888">${esc(fin.pendiente)}</div><div style="font-size:.55rem;color:#888;text-transform:uppercase">Pendiente</div></div>
          <div><div style="font-size:1.3rem;font-weight:700">${esc(fin.total)}</div><div style="font-size:.55rem;color:#888;text-transform:uppercase">Total</div></div>
        </div>
        ${(fin.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #eee;font-size:.82rem"><span>${esc(it.label)}</span><span style="font-weight:700;color:${it.pagado?'#0a0a0a':'#888'}">${esc(it.valor)}</span></div>`).join('')}
        ${fin.hito?`<div style="margin-top:1rem;padding:.75rem 1rem;background:#f4f4f2;border-left:3px solid ${accent}"><div style="font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:.2rem">Proximo hito</div><div style="font-size:.88rem;font-weight:700">${esc(fin.hito)}</div></div>`:''}
      </div>
    </div>`;
  document.getElementById('preview-modal').classList.add('open');
}
function closePreview(){document.getElementById('preview-modal').classList.remove('open');}

// ── PUBLISH REPORT ────────────────────────────────────────────────────────────
async function publishReport(){pendingData=collectData();await doPublish();}
async function publishFromPreview(){closePreview();await doPublish();}

async function doPublish(){
  if(!currentId||!pendingData)return;
  const overlay=document.getElementById('pub-overlay'),msg=document.getElementById('pub-msg');
  overlay.classList.add('show');msg.textContent='Guardando fotos...';
  try{
    const batch=db.batch();
    const colRef=db.collection('projects').doc(PROJECT_ID).collection('reports').doc(currentId).collection('fotos');
    for(const f of currentFotos){
      if(f.isNew&&!f.toDelete){const ref=colRef.doc();f.id=ref.id;f.isNew=false;batch.set(ref,{src:f.src,caption:f.caption,order:f.order});}
      if(f.toDelete&&f.id){batch.delete(colRef.doc(f.id));}
      if(!f.isNew&&!f.toDelete&&f.id){batch.update(colRef.doc(f.id),{caption:f.caption,order:f.order});}
    }
    await batch.commit();
    currentFotos=currentFotos.filter(f=>!f.toDelete);
    msg.textContent='Publicando informe...';
    const data={...pendingData,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    await db.collection('projects').doc(PROJECT_ID).collection('reports').doc(currentId).update(data);
    await db.collection('projects').doc(PROJECT_ID).update({pctGlobal:data.pctGlobal,informeCount:allReports.length});
    const idx=allReports.findIndex(r=>r.id===currentId);
    if(idx>=0)allReports[idx]={...allReports[idx],...data};
    msg.textContent='Publicado';
    setTimeout(()=>{overlay.classList.remove('show');renderReportList();renderFotosGrid();toast('Informe publicado');updateWaBtn();},700);
  }catch(e){overlay.classList.remove('show');toast('Error: '+e.message);console.error(e);}
}

// ── PUBLISH VERSION ───────────────────────────────────────────────────────────
async function publishVersion(){
  if(!currentVerId)return;
  const overlay=document.getElementById('pub-overlay'),msg=document.getElementById('pub-msg');
  overlay.classList.add('show');msg.textContent='Guardando imagenes...';
  try{
    const vdata=collectVersionData();
    const batch=db.batch();
    const rCol=db.collection('projects').doc(PROJECT_ID).collection('versions').doc(currentVerId).collection('renders');
    const pCol=db.collection('projects').doc(PROJECT_ID).collection('versions').doc(currentVerId).collection('planos');
    for(const r of currentRenders){
      if(r.isNew&&!r.toDelete){const ref=rCol.doc();r.id=ref.id;r.isNew=false;batch.set(ref,{src:r.src,caption:r.caption,order:r.order});}
      if(r.toDelete&&r.id){batch.delete(rCol.doc(r.id));}
      if(!r.isNew&&!r.toDelete&&r.id){batch.update(rCol.doc(r.id),{caption:r.caption,order:r.order});}
    }
    for(const p of currentPlanos){
      if(p.isNew&&!p.toDelete){const ref=pCol.doc();p.id=ref.id;p.isNew=false;batch.set(ref,{src:p.src,caption:p.caption,order:p.order});}
      if(p.toDelete&&p.id){batch.delete(pCol.doc(p.id));}
      if(!p.isNew&&!p.toDelete&&p.id){batch.update(pCol.doc(p.id),{caption:p.caption,order:p.order});}
    }
    await batch.commit();
    currentRenders=currentRenders.filter(r=>!r.toDelete);
    currentPlanos=currentPlanos.filter(p=>!p.toDelete);
    msg.textContent='Publicando version...';
    await db.collection('projects').doc(PROJECT_ID).collection('versions').doc(currentVerId).update({...vdata,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    const idx=allVersions.findIndex(v=>v.id===currentVerId);
    if(idx>=0)allVersions[idx]={...allVersions[idx],...vdata};
    msg.textContent='Publicado';
    setTimeout(()=>{overlay.classList.remove('show');renderVersionList();renderRendersGrid();renderPlanosGrid();toast('Version publicada');},700);
  }catch(e){overlay.classList.remove('show');toast('Error: '+e.message);console.error(e);}
}

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function updateWaBtn(){
  const btn=document.getElementById('wa-btn');if(!btn)return;
  const r=allReports.find(x=>x.id===currentId)||{};
  const url=window.location.origin+'/login.html';
  const msg=encodeURIComponent('Nuevo informe — '+(project?.nombre||'')+'
'+(r.titulo||'')+' · '+(r.fecha||'')+'
Avance: '+(r.pctGlobal||0)+'%

'+url);
  btn.href='https://wa.me/?text='+msg;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
</script>
