<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin - Proyecto</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;background:#f4f4f2;color:#0a0a0a;min-height:100vh}
:root{--k:#002FA7;--t:#9E3A26;--b:#e0e0dc;--g:#f4f4f2}
.topbar{background:var(--k);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--t);position:sticky;top:0;z-index:200}
.tl{display:flex;align-items:center;gap:1rem}
.tb{font-size:.92rem;font-weight:700;color:#fff}
.ts{color:rgba(255,255,255,.25)}
.tp{font-size:.82rem;font-weight:700;color:rgba(255,255,255,.85)}
.tr{display:flex;align-items:center;gap:.6rem}
.bs{padding:.38rem .85rem;font-size:.6rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.bs:hover{background:rgba(255,255,255,.2);color:#fff}
.bt{background:var(--t);color:#fff;border-color:var(--t)}.bt:hover{opacity:.85}
.ml{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 52px)}
.sb{background:#fff;border-right:1px solid var(--b);display:flex;flex-direction:column}
.stabs{display:flex;border-bottom:1px solid var(--b)}
.stab{flex:1;padding:.75rem .5rem;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:center;cursor:pointer;border:none;background:transparent;color:#888;transition:all .2s;border-bottom:2px solid transparent}
.stab.active{color:var(--k);border-bottom-color:var(--k)}
.sp{display:none;flex-direction:column;flex:1;overflow:hidden}
.sp.active{display:flex}
.bn{display:block;width:100%;padding:.8rem;text-align:center;background:var(--t);color:#fff;font-size:.62rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;flex-shrink:0}
.bn:hover{background:#7a2d1e}
.si{padding:1.25rem;flex:1;overflow-y:auto}
.sl{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;font-weight:700;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid #eee}
.rl{list-style:none}
.rli{padding:.65rem .8rem;cursor:pointer;border-radius:3px;transition:background .15s;margin-bottom:.15rem}
.rli:hover{background:var(--g)}
.rli.active{background:var(--k);color:#fff}
.rli.active .rn{color:#ffd060}
.rn{font-size:.58rem;font-weight:700;letter-spacing:.1em;color:var(--t)}
.rt{font-size:.8rem;font-weight:700}
.rd{font-size:.56rem;color:#888}
.rli.active .rd{color:rgba(255,255,255,.45)}
.ra{display:none;gap:.25rem;margin-top:.25rem}
.rli:hover .ra,.rli.active .ra{display:flex}
.bdr{padding:.12rem .35rem;background:rgba(158,58,38,.1);border:none;cursor:pointer;font-size:.56rem;color:var(--t);border-radius:2px;font-weight:700;transition:all .2s}
.bdr:hover{background:var(--t);color:#fff}
.vli{padding:.65rem .8rem;cursor:pointer;border-radius:3px;transition:background .15s;margin-bottom:.15rem;display:flex;justify-content:space-between;align-items:center}
.vli:hover{background:var(--g)}
.vli.active{background:var(--k);color:#fff}
.vl2{font-size:.78rem;font-weight:700}
.vd{font-size:.54rem;color:#888}
.vli.active .vd{color:rgba(255,255,255,.45)}
.bc{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--t);color:#fff;padding:.1rem .35rem;border-radius:2px;white-space:nowrap}
.co{padding:2rem 2.5rem;max-width:900px;overflow-y:auto}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid #d0d0cc;flex-wrap:wrap;gap:1rem}
.ct{font-size:1.35rem;font-weight:700}
.cs{font-size:.68rem;color:#888;margin-top:.2rem}
.ca{display:flex;gap:.6rem;flex-wrap:wrap}
.fs{background:#fff;padding:1.5rem;margin-bottom:1.25rem;border:1px solid var(--b)}
.ft{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem;color:#0a0a0a}
.ft::after{content:'';flex:1;height:1px;background:#eee}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.fc{margin-bottom:1.25rem}
.fl{display:block;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.35rem}
.fi{width:100%;padding:.62rem .8rem;background:#fff;border:1px solid #d0d0cc;color:#0a0a0a;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--k)}
.fi:disabled{background:#f9f9f7;color:#888}
.pi{background:#f9f9f7;border:1px solid #e8e8e4;padding:1rem;margin-bottom:.75rem}
.pih{display:grid;grid-template-columns:1fr 70px 32px;gap:.75rem;align-items:center;margin-bottom:.6rem}
.ps{-webkit-appearance:none;width:100%;height:4px;background:#d0d0cc;outline:none;cursor:pointer;margin-bottom:.5rem}
.ps::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--t);border-radius:50%;cursor:pointer}
.pp{font-size:1.1rem;font-weight:700;text-align:right}
.br2{width:32px;height:32px;background:#fff;border:1px solid #d0d0cc;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.br2:hover{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.ba{padding:.5rem 1rem;background:transparent;border:1px solid #d0d0cc;font-size:.62rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:.5rem}
.ba:hover{border-color:var(--k);background:var(--k);color:#fff}
.ni{display:grid;grid-template-columns:130px 1fr 32px;gap:.6rem;align-items:start;margin-bottom:.6rem}
.dz{border:2px dashed #d0d0cc;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem}
.dz:hover,.dz.ov{border-color:var(--k);background:#f0f4ff}
.dl{font-size:.78rem;color:#888}
.dl strong{color:#0a0a0a}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.75rem}
.fc2{position:relative;background:#f4f4f2;border:1px solid var(--b)}
.fc2 img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.fo{position:absolute;top:.4rem;right:.4rem}
.bd{background:rgba(255,107,107,.9);color:#fff;border:none;padding:.25rem .5rem;font-size:.58rem;font-weight:700;cursor:pointer}
.cap{width:100%;padding:.35rem .4rem;font-size:.6rem;border:none;border-top:1px solid var(--b);background:#fff;font-family:inherit;outline:none}
.pb{height:3px;background:#d0d0cc;margin:.5rem 0;display:none;overflow:hidden}
.pbf{height:100%;background:var(--t);width:0;transition:width .2s}
.fni{display:grid;grid-template-columns:1fr 130px auto 32px;gap:.6rem;align-items:center;margin-bottom:.6rem}
.cl{display:flex;align-items:center;gap:.35rem;font-size:.75rem;cursor:pointer;white-space:nowrap}
.cl input{accent-color:var(--t)}
.ips{width:100%;max-height:140px;object-fit:cover;display:block;border:1px solid var(--b);margin-bottom:.5rem}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.pc2{position:relative;background:#f4f4f2;border:1px solid var(--b)}
.pc2 img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pcap{width:100%;padding:.35rem .4rem;font-size:.6rem;border:none;border-top:1px solid var(--b);background:#fff;font-family:inherit;outline:none}
.vro{background:#f9f9f7;border:1px solid var(--b);padding:1rem;margin-bottom:.75rem;font-size:.82rem;color:#555;font-style:italic}
#pm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;flex-direction:column}
#pm.open{display:flex}
.ptb{background:#0a0a0a;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--t);flex-shrink:0}
.ptt{color:var(--t);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
#pb2{flex:1;overflow-y:auto;background:#fafafa;padding:2rem}
#pin{max-width:860px;margin:0 auto}
#po{display:none;position:fixed;inset:0;background:rgba(10,10,10,.75);z-index:500;align-items:center;justify-content:center}
#po.show{display:flex}
.pob{background:#fff;padding:2.5rem 3rem;text-align:center;border-top:3px solid var(--t);min-width:240px}
.pos{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--t);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.pom{font-size:.8rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.toast{position:fixed;bottom:2rem;right:2rem;background:#0a0a0a;color:#fff;padding:.9rem 1.5rem;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border-left:3px solid var(--t);opacity:0;transform:translateY(8px);transition:all .3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.ec{text-align:center;padding:4rem 0;color:#aaa;font-size:.88rem}
@media(max-width:860px){.ml{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.fg,.pg{grid-template-columns:repeat(2,1fr)}.fni{grid-template-columns:1fr 110px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tl">
    <div class="tb">espacio humo</div>
    <span class="ts">/</span>
    <span class="tp" id="tpj">Cargando...</span>
  </div>
  <div class="tr">
    <button class="bs" onclick="goBack()">Proyectos</button>
    <button class="bs" onclick="openClientView()">Ver como cliente</button>
    <button class="bs" onclick="doLogout()">Salir</button>
  </div>
</div>
<div class="ml">
  <aside class="sb">
    <div class="stabs">
      <button class="stab active" id="ti" onclick="switchTab('i')">Informes</button>
      <button class="stab" id="tp2" onclick="switchTab('p')">Proyecto</button>
    </div>
    <div class="sp active" id="spi">
      <button class="bn" onclick="newReport()">+ Nuevo informe</button>
      <div class="si">
        <div class="sl">Informes publicados</div>
        <ul class="rl" id="rlist"></ul>
      </div>
    </div>
    <div class="sp" id="spp">
      <button class="bn" onclick="newVersion()">+ Nueva version</button>
      <div class="si">
        <div class="sl">Versiones</div>
        <ul class="rl" id="vlist"></ul>
      </div>
    </div>
  </aside>
  <main class="co" id="co">
    <div class="ec">Selecciona un informe o crea uno nuevo</div>
  </main>
</div>
<div id="pm">
  <div class="ptb">
    <span class="ptt">Vista previa</span>
    <div style="display:flex;gap:.6rem">
      <button class="bs bt" onclick="publishFromPreview()">Publicar</button>
      <button class="bs" onclick="closePreview()">Cerrar</button>
    </div>
  </div>
  <div id="pb2"><div id="pin"></div></div>
</div>
<div id="po"><div class="pob"><div class="pos"></div><div class="pom" id="pom">Publicando...</div></div></div>
<div class="toast" id="toast"></div>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);}
var db=firebase.firestore(),auth=firebase.auth();
var params=new URLSearchParams(window.location.search);
var PID=params.get('id');
var project=null,allReports=[],allVersions=[],curId=null,curVId=null;
var curFotos=[],curRenders=[],curPlanos=[],curHero=null,curAxo=null,pending=null;
var pc=0,nc=0,fc=0,tab='i';

// FIX DEFINITIVO: no depende de onAuthStateChanged
// Espera activamente hasta que Firebase resuelva el estado
function waitForAuth(){
  return new Promise(function(resolve,reject){
    // Si ya hay usuario, resolver inmediatamente
    if(auth.currentUser){resolve(auth.currentUser);return;}
    // Sino, esperar hasta 5 segundos
    var done=false;
    var unsub=auth.onAuthStateChanged(function(user){
      if(done)return;
      done=true;
      unsub();
      resolve(user);
    });
    setTimeout(function(){
      if(!done){done=true;unsub();resolve(null);}
    },5000);
  });
}

// Iniciar
waitForAuth().then(function(user){
  if(!user){window.location.replace('admin.html');return;}
  if(!PID){window.location.replace('admin.html');return;}
  loadProject();
});

function doLogout(){auth.signOut().then(function(){window.location.replace('admin.html');});}
function goBack(){window.location.replace('admin.html');}
function openClientView(){window.open('viewer.html?id='+PID+'&preview=true','_blank');}

function loadProject(){
  db.collection('projects').doc(PID).get().then(function(d){
    if(!d.exists){window.location.replace('admin.html');return;}
    project=Object.assign({id:d.id},d.data());
    document.getElementById('tpj').textContent=project.nombre||'Proyecto';
    document.title='Admin - '+(project.nombre||'');
    loadReports();
    loadVersions();
  }).catch(function(e){toast('Error cargando proyecto: '+e.message);});
}

function switchTab(t){
  tab=t;
  document.getElementById('ti').classList.toggle('active',t==='i');
  document.getElementById('tp2').classList.toggle('active',t==='p');
  document.getElementById('spi').classList.toggle('active',t==='i');
  document.getElementById('spp').classList.toggle('active',t==='p');
  document.getElementById('co').innerHTML='<div class="ec">Selecciona un elemento o crea uno nuevo</div>';
  curId=null;curVId=null;
}

function loadReports(){
  db.collection('projects').doc(PID).collection('reports').orderBy('createdAt','asc').get()
  .then(function(s){
    allReports=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderRL();
    if(allReports.length&&tab==='i')selectReport(allReports[allReports.length-1].id);
  }).catch(function(e){toast('Error informes: '+e.message);});
}

function renderRL(){
  document.getElementById('rlist').innerHTML=allReports.map(function(r){
    var a=r.id===curId?'active':'';
    return '<li class="rli '+a+'" onclick="selectReport(\''+r.id+'\')">'
      +'<div class="rn">#'+String(r.numero||0).padStart(3,'0')+'</div>'
      +'<div class="rt">'+esc(r.titulo||'Sin titulo')+'</div>'
      +'<div class="rd">'+esc(r.fecha||'Sin fecha')+'</div>'
      +'<div class="ra"><button class="bdr" onclick="event.stopPropagation();delReport(\''+r.id+'\',\''+esc(r.titulo||'')+'\')">Eliminar</button></div>'
      +'</li>';
  }).join('');
}

function selectReport(id){
  curId=id;renderRL();
  var r=allReports.find(function(x){return x.id===id;});
  curFotos=[];curHero=r.heroB64||null;curAxo=r.axoB64||null;
  db.collection('projects').doc(PID).collection('reports').doc(id)
  .collection('fotos').orderBy('order','asc').get()
  .then(function(s){
    s.docs.forEach(function(d){
      curFotos.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false});
    });
    renderRF(r);
  }).catch(function(){renderRF(r);});
}

function newReport(){
  var last=allReports.length?allReports[allReports.length-1]:null;
  var num=last?((last.numero||0)+1):0;
  var draft={
    numero:num,titulo:'Informe N '+num,fecha:'',
    etapa:last?(last.etapa||''):'',
    pctGlobal:last?(last.pctGlobal||0):0,
    clima:{texto:'Dias lluvia: 0',sub:'Sin impacto'},
    progreso:last&&last.progreso?last.progreso.map(function(p){return Object.assign({},p);}):
      [{nombre:'Tareas Preliminares',val:0,nota:''},{nombre:'Estructura',val:0,nota:''},{nombre:'Albanileria',val:0,nota:''},{nombre:'Instalaciones',val:0,nota:''}],
    galeriaTitle:'Lo que esta sucediendo en obra',
    novedades:[{fecha:'',texto:''}],
    financiero:last&&last.financiero?JSON.parse(JSON.stringify(last.financiero)):{pagadoPct:0,pagado:'$0',pendiente:'$0',total:'$0',items:[],hito:''},
    proximoInforme:'',heroB64:null,axoB64:null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('projects').doc(PID).collection('reports').add(draft)
  .then(function(ref){
    draft.id=ref.id;allReports.push(draft);
    curFotos=[];curHero=null;curAxo=null;curId=ref.id;
    renderRL();renderRF(draft);
    db.collection('projects').doc(PID).update({informeCount:allReports.length});
    toast('Nuevo informe creado');
  }).catch(function(e){toast('Error: '+e.message);});
}

function delReport(id,titulo){
  if(!confirm('Eliminar "'+titulo+'"?'))return;
  var ref=db.collection('projects').doc(PID).collection('reports').doc(id);
  ref.collection('fotos').get().then(function(s){
    var b=db.batch();s.docs.forEach(function(d){b.delete(d.ref);});return b.commit();
  }).then(function(){return ref.delete();})
  .then(function(){
    allReports=allReports.filter(function(r){return r.id!==id;});
    if(curId===id){curId=null;document.getElementById('co').innerHTML='<div class="ec">Selecciona un informe</div>';}
    renderRL();
    db.collection('projects').doc(PID).update({informeCount:allReports.length});
    toast('Eliminado');
  }).catch(function(e){toast('Error: '+e.message);});
}

function loadVersions(){
  db.collection('projects').doc(PID).collection('versions').orderBy('createdAt','desc').get()
  .then(function(s){
    allVersions=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderVL();
  }).catch(function(){});
}

function renderVL(){
  if(!allVersions.length){document.getElementById('vlist').innerHTML='<li style="padding:.75rem;font-size:.72rem;color:#aaa">Sin versiones</li>';return;}
  document.getElementById('vlist').innerHTML=allVersions.map(function(v,i){
    var a=v.id===curVId?'active':'';
    return '<li class="vli '+a+'" onclick="selectVersion(\''+v.id+'\')">'
      +'<div><div class="vl2">'+esc(v.titulo||'Version')+'</div><div class="vd">'+esc(v.fecha||'')+'</div></div>'
      +(i===0?'<span class="bc">Actual</span>':'')
      +'</li>';
  }).join('');
}

function selectVersion(id){
  curVId=id;renderVL();
  var v=allVersions.find(function(x){return x.id===id;});
  curRenders=[];curPlanos=[];
  var vRef=db.collection('projects').doc(PID).collection('versions').doc(id);
  Promise.all([
    vRef.collection('renders').orderBy('order','asc').get(),
    vRef.collection('planos').orderBy('order','asc').get()
  ]).then(function(rs){
    rs[0].docs.forEach(function(d){curRenders.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false});});
    rs[1].docs.forEach(function(d){curPlanos.push({id:d.id,src:d.data().src,caption:d.data().caption||'',order:d.data().order||0,isNew:false,toDelete:false});});
    renderVF(v);
  }).catch(function(){renderVF(v);});
}

function newVersion(){
  var num=allVersions.length+1;
  var draft={titulo:'Version '+num,fecha:'',etapa:'Anteproyecto primera revision',descripcion:'',memoria:'',computo:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  db.collection('projects').doc(PID).collection('versions').add(draft)
  .then(function(ref){
    draft.id=ref.id;allVersions.unshift(draft);curRenders=[];curPlanos=[];curVId=ref.id;
    renderVL();renderVF(draft);toast('Nueva version creada');
  }).catch(function(e){toast('Error: '+e.message);});
}

function g(id){var el=document.getElementById(id);return el?el.value:'';}

function renderRF(r){
  pc=0;nc=0;fc=0;
  var fin=r.financiero||{};
  var ac=(project&&project.color)?project.color:'#002FA7';
  var hs=curHero||(project&&project.coverB64)||'';
  var ph=(r.progreso||[]).map(function(p,i){return rPI(p,i);}).join('');
  var nh=(r.novedades||[]).map(function(n,i){return rNI(n,i);}).join('');
  var fh=(fin.items||[]).map(function(it,i){return rFI(it,i);}).join('');
  var axoHtml=curAxo
    ?'<img src="'+curAxo+'" class="ips" style="max-width:300px"/>'
    :'<div style="background:#f4f4f2;border:1px dashed #ccc;padding:1.5rem;text-align:center;font-size:.62rem;color:#aaa;margin-bottom:.75rem;max-width:180px">SVG por defecto</div>';

  document.getElementById('co').innerHTML=
    '<div class="ch"><div><div class="ct">'+esc(r.titulo||'')+' <span style="color:#888;font-weight:400;font-size:1rem">'+esc(r.fecha||'sin fecha')+'</span></div></div>'
    +'<div class="ca"><button class="bs" style="background:#f4f4f2;color:#0a0a0a;border:1px solid #d0d0cc" onclick="openPreview()">Vista previa</button>'
    +'<button class="bs bt" onclick="publishReport()">Publicar</button></div></div>'

    +'<div class="fs"><div class="ft">Datos generales</div>'
    +'<div class="fr"><div><label class="fl">Titulo</label><input class="fi" id="ft" value="'+esc(r.titulo)+'"/></div>'
    +'<div><label class="fl">Fecha</label><input class="fi" id="ff" value="'+esc(r.fecha)+'" placeholder="Junio 2026"/></div></div>'

function hDrop(e){e.preventDefault();document.getElementById('dz').classList.remove('ov');hFotos(e.dataTransfer.files);}
function hFotos(files){
  var arr=Array.from(files);if(!arr.length)return;
  var bar=document.getElementById('fbar'),fil=document.getElementById('ffil');
  bar.style.display='block';
  Promise.all(arr.map(function(f,i){
    return compress(f,1000,78).then(function(c){
      fil.style.width=((i+1)/arr.length*90)+'%';
      curFotos.push({id:null,src:c,caption:f.name.replace(/\.[^.]+$/,''),order:curFotos.length,isNew:true,toDelete:false});
    });
  })).then(function(){
    fil.style.width='100%';
    setTimeout(function(){bar.style.display='none';fil.style.width='0';},500);
    renderFG();
    toast(arr.length+' foto'+(arr.length>1?'s':'')+' lista'+(arr.length>1?'s':''));
  });
}
function renderFG(){
  var grid=document.getElementById('fgrid');if(!grid)return;
  var vis=curFotos.filter(function(f){return!f.toDelete;});
  grid.innerHTML=vis.map(function(f){
    var ri=curFotos.indexOf(f);
    return '<div class="fc2"><img src="'+f.src+'" alt="'+esc(f.caption)+'"/>'
      +'<div class="fo"><button class="bd" onclick="rmF('+ri+')">x</button></div>'
      +'<input class="cap" id="cap'+ri+'" value="'+esc(f.caption)+'" placeholder="Caption"/></div>';
  }).join('');
}
function rmF(i){if(curFotos[i].id){curFotos[i].toDelete=true;}else{curFotos.splice(i,1);}renderFG();}

function hidePB(id){document.getElementById(id+'fil').style.width='100%';setTimeout(function(){document.getElementById(id+'bar').style.display='none';},400);}

function compress(file,maxW,q){
  return new Promise(function(resolve){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var r=Math.min(maxW/img.width,1),c=document.createElement('canvas');
      c.width=img.width*r;c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',q/100));
    };img.src=url;
  });
}

function collectD(){
  curFotos.forEach(function(f,i){var el=document.getElementById('cap'+i);if(el)f.caption=el.value;});
  var prog=[];
  document.querySelectorAll('[id^="pi"]').forEach(function(row){
    var i=row.id.replace('pi','');
    if(isNaN(parseInt(i)))return;
    prog.push({nombre:g('pn'+i),val:parseInt(g('pv'+i))||0,nota:g('pno'+i)});
  });
  var nov=[];
  document.querySelectorAll('[id^="ni"]').forEach(function(row){
    var i=row.id.replace('ni','');
    if(isNaN(parseInt(i)))return;
    var txt=g('nt'+i);
    if(txt)nov.push({fecha:g('nf'+i),texto:txt});
  });
  var fitems=[];
  document.querySelectorAll('[id^="fii"]').forEach(function(row){
    var i=row.id.replace('fii','');
    if(isNaN(parseInt(i)))return;
    var lbl=g('fl'+i);
    if(lbl)fitems.push({label:lbl,valor:g('fv'+i),pagado:document.getElementById('fpd'+i)?document.getElementById('fpd'+i).checked:false});
  });
  return {
    titulo:g('ft'),fecha:g('ff'),etapa:g('fe'),pctGlobal:parseInt(g('fp'))||0,
    clima:{texto:g('fct'),sub:g('fcs')},
    superficieTotal:parseInt(g('fsu'))||0,proximoInforme:g('fpr'),galeriaTitle:g('fga'),
    progreso:prog,novedades:nov,fotos:curFotos,heroB64:curHero,axoB64:curAxo,
    financiero:{pagadoPct:parseInt(g('finp'))||0,total:g('fint'),pagado:g('finpag'),pendiente:g('finpen'),hito:g('finh'),items:fitems}
  };
}

function collectVD(){
  curRenders.forEach(function(r,i){var el=document.getElementById('rc'+i);if(el)r.caption=el.value;});
  curPlanos.forEach(function(p,i){var el=document.getElementById('pc'+i);if(el)p.caption=el.value;});
  return {titulo:g('vt'),fecha:g('vf'),etapa:g('ve'),descripcion:g('vd'),memoria:g('vm'),computo:g('vc')};
}

    +'<div><div style="font-size:1.3rem;font-weight:700;color:#888">'+esc(fin.pendiente||'')+'</div><div style="font-size:.55rem;color:#888;text-transform:uppercase">Pendiente</div></div>'
    +'<div><div style="font-size:1.3rem;font-weight:700">'+esc(fin.total||'')+'</div><div style="font-size:.55rem;color:#888;text-transform:uppercase">Total</div></div></div>'
    +(fin.items||[]).map(function(it){return '<div style="display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #eee;font-size:.82rem"><span>'+esc(it.label)+'</span><span style="font-weight:700;color:'+(it.pagado?'#0a0a0a':'#888')+'">'+esc(it.valor)+'</span></div>';}).join('')
    +(fin.hito?'<div style="margin-top:1rem;padding:.75rem 1rem;background:#f4f4f2;border-left:3px solid '+ac+'"><div style="font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:.2rem">Proximo hito</div><div style="font-size:.88rem;font-weight:700">'+esc(fin.hito)+'</div></div>':'')
    +'</div></div>';
  document.getElementById('pm').classList.add('open');
}
function closePreview(){document.getElementById('pm').classList.remove('open');}

function publishReport(){pending=collectD();doPublish();}
function publishFromPreview(){closePreview();doPublish();}

function doPublish(){
  if(!curId||!pending)return;
  var ov=document.getElementById('po'),msg=document.getElementById('pom');
  ov.classList.add('show');msg.textContent='Guardando fotos...';
  var col=db.collection('projects').doc(PID).collection('reports').doc(curId).collection('fotos');
  var batch=db.batch();
  curFotos.forEach(function(f){
    if(f.isNew&&!f.toDelete){var ref=col.doc();f.id=ref.id;f.isNew=false;batch.set(ref,{src:f.src,caption:f.caption,order:f.order});}
    if(f.toDelete&&f.id){batch.delete(col.doc(f.id));}
    if(!f.isNew&&!f.toDelete&&f.id){batch.update(col.doc(f.id),{caption:f.caption,order:f.order});}
  });
  batch.commit().then(function(){
    curFotos=curFotos.filter(function(f){return!f.toDelete;});
    msg.textContent='Publicando informe...';
    var data=Object.assign({},pending,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    return db.collection('projects').doc(PID).collection('reports').doc(curId).update(data);
  }).then(function(){
    return db.collection('projects').doc(PID).update({pctGlobal:pending.pctGlobal,informeCount:allReports.length});
  }).then(function(){
    var idx=allReports.findIndex(function(r){return r.id===curId;});
    if(idx>=0)allReports[idx]=Object.assign(allReports[idx],pending);
    msg.textContent='Publicado';
    setTimeout(function(){ov.classList.remove('show');renderRL();renderFG();toast('Informe publicado');updateWA();},700);
  }).catch(function(e){ov.classList.remove('show');toast('Error: '+e.message);console.error(e);});
}

function publishVersion(){
  if(!curVId)return;
  var ov=document.getElementById('po'),msg=document.getElementById('pom');
  ov.classList.add('show');msg.textContent='Guardando imagenes...';
  var vd=collectVD();
  var batch=db.batch();
  var vRef=db.collection('projects').doc(PID).collection('versions').doc(curVId);
  var rCol=vRef.collection('renders'),pCol=vRef.collection('planos');
  curRenders.forEach(function(r){if(r.isNew&&!r.toDelete){var ref=rCol.doc();r.id=ref.id;r.isNew=false;batch.set(ref,{src:r.src,caption:r.caption,order:r.order});}if(r.toDelete&&r.id){batch.delete(rCol.doc(r.id));}if(!r.isNew&&!r.toDelete&&r.id){batch.update(rCol.doc(r.id),{caption:r.caption,order:r.order});}});
  curPlanos.forEach(function(p){if(p.isNew&&!p.toDelete){var ref=pCol.doc();p.id=ref.id;p.isNew=false;batch.set(ref,{src:p.src,caption:p.caption,order:p.order});}if(p.toDelete&&p.id){batch.delete(pCol.doc(p.id));}if(!p.isNew&&!p.toDelete&&p.id){batch.update(pCol.doc(p.id),{caption:p.caption,order:p.order});}});
  batch.commit().then(function(){
    curRenders=curRenders.filter(function(r){return!r.toDelete;});
    curPlanos=curPlanos.filter(function(p){return!p.toDelete;});
    msg.textContent='Publicando version...';
    return vRef.update(Object.assign({},vd,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()}));
  }).then(function(){
    var idx=allVersions.findIndex(function(v){return v.id===curVId;});
    if(idx>=0)allVersions[idx]=Object.assign(allVersions[idx],vd);
    msg.textContent='Publicado';
    setTimeout(function(){ov.classList.remove('show');renderVL();renderRG();renderPG();toast('Version publicada');},700);
  }).catch(function(e){ov.classList.remove('show');toast('Error: '+e.message);console.error(e);});
}

function updateWA(){
  var btn=document.getElementById('wabtn');if(!btn)return;
  var r=allReports.find(function(x){return x.id===curId;})||{};
  var url=window.location.origin+'/login.html';
  var msg=encodeURIComponent('Nuevo informe '+((project&&project.nombre)||'')+'\n'+(r.titulo||'')+' - '+(r.fecha||'')+'\nAvance: '+(r.pctGlobal||0)+'%\n\n'+url);
  btn.href='https://wa.me/?text='+msg;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3000);}
</script>
</body>
</html>
