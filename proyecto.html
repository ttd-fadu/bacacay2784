<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo — proyecto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:#0a0a0a;font-family:'Poppins',sans-serif;overflow-x:hidden}
:root{--accent:#002FA7;--border:#ebebeb}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:#002FA7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease}
#loading-screen.hide{opacity:0;pointer-events:none}
.loading-logo{font-size:clamp(1.8rem,5vw,3rem);font-weight:700;color:#fff;letter-spacing:-.02em;margin-bottom:1.5rem;font-family:'Poppins',sans-serif}
.loading-dots{display:flex;gap:.5rem}
.loading-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);animation:dotPulse 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{background:rgba(255,255,255,.2);transform:scale(.8)}40%{background:#fff;transform:scale(1)}}

/* LAYOUT */
.layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:280px;flex-shrink:0;height:100vh;padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:10}
.sidebar-brand{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;color:#0a0a0a;text-decoration:none;display:block;margin-bottom:2.5rem;line-height:1;transition:opacity .2s}
.sidebar-brand:hover{opacity:.5}
.sidebar-brand span{color:var(--accent)}
nav{display:flex;flex-direction:column;gap:.05rem}
.nav-link{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;color:#0a0a0a;text-decoration:none;padding:.15rem 0;transition:opacity .2s;line-height:1.35}
.nav-link:hover{opacity:.35}
.nav-link.active{color:var(--accent)}
.sidebar-contact{font-size:.68rem;line-height:2.1;color:#0a0a0a}
.sidebar-contact a{color:var(--accent);text-decoration:none;transition:opacity .2s;display:block}
.sidebar-contact a:hover{opacity:.55}

/* MAIN */
.main{flex:1;overflow:hidden}

/* HERO */
.hero{position:relative;height:75svh;min-height:460px;overflow:hidden}
.hero-slides{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;background-size:cover;background-position:center}
.hero-slide.active{opacity:1}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,.75) 0%,rgba(10,10,10,.1) 60%)}
.hero-title{position:absolute;bottom:2.5rem;left:3rem;font-size:clamp(2rem,5vw,4.5rem);font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1;z-index:2}
.hero-dots{position:absolute;bottom:1.2rem;right:2rem;display:flex;gap:.4rem;z-index:3}
.hero-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:background .2s}
.hero-dot.active{background:#fff}

/* CONTENT */
.content{padding:3.5rem 3rem 5rem}

/* FICHA */
.project-name{font-size:clamp(2rem,4vw,3.2rem);font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:.95;margin-bottom:1.2rem}
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:.1rem 2.5rem;margin-bottom:1.4rem}
.ficha-row{font-size:.68rem;line-height:2}
.ficha-key{color:#aaa;font-weight:300;font-style:italic}
.ficha-val{font-weight:700;color:#0a0a0a}
.divider{height:1px;background:var(--border);margin-bottom:1.8rem}
.descripcion{font-size:.82rem;line-height:1.9;color:#555;max-width:560px;font-weight:300;margin-bottom:3.5rem}

/* GALERÍA */
.galeria-label{font-size:.62rem;font-weight:300;font-style:italic;color:#0a0a0a;margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem}
.galeria-label::after{content:'';flex:1;height:1px;background:var(--border)}
.masonry{columns:2;column-gap:.75rem}
.masonry-item{break-inside:avoid;margin-bottom:.75rem;overflow:hidden;cursor:zoom-in;position:relative;opacity:0;transform:translateY(18px);transition:opacity .65s cubic-bezier(.16,1,.3,1),transform .65s cubic-bezier(.16,1,.3,1)}
.masonry-item.visible{opacity:1;transform:translateY(0)}
.masonry-item:nth-child(2n){margin-top:.9rem}
.masonry-item:nth-child(3n){margin-top:-.4rem}
.masonry-item img{width:100%;height:auto;display:block;transition:transform .55s cubic-bezier(.16,1,.3,1)}
.masonry-item:hover img{transform:scale(1.03)}
.masonry-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(10,10,10,.7));color:#fff;font-size:.52rem;letter-spacing:.1em;padding:1.5rem .6rem .5rem;opacity:0;transition:opacity .3s;font-weight:700;text-transform:uppercase}
.masonry-item:hover .masonry-caption{opacity:1}

/* NAV INFERIOR */
.project-nav{border-top:1px solid var(--border);margin-top:4rem;padding:1.8rem 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
.project-nav-item{display:flex;flex-direction:column;gap:.25rem;text-decoration:none}
.project-nav-item.next{text-align:right}
.project-nav-direction{font-size:.6rem;font-weight:300;font-style:italic;color:#aaa}
.project-nav-name{font-size:.82rem;font-weight:700;color:var(--accent);transition:opacity .2s}
.project-nav-item:hover .project-nav-name{opacity:.5}

/* LIGHTBOX */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:94vh;object-fit:contain}
#lb-close{position:absolute;top:1.2rem;right:1.4rem;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.8rem;cursor:pointer;line-height:1;transition:color .2s;font-family:inherit}
#lb-close:hover{color:#fff}

@media(max-width:900px){
  body{overflow:auto}
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);padding:2rem;position:relative}
  .main{overflow:visible}
  .hero-title{left:1.5rem;font-size:clamp(1.8rem,7vw,3rem)}
  .content{padding:2rem 1.5rem 4rem}
  .project-nav{flex-direction:column;gap:1.5rem}
  .project-nav-item.next{text-align:left}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">espacio humo</div>
  <div class="loading-dots">
    <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
  </div>
</div>

<div id="app" style="display:none">
<div class="layout">

  <aside class="sidebar">
    <div>
      <a class="sidebar-brand" href="index.html">espacio <span>humo</span></a>
      <nav>
        <a class="nav-link active" href="portfolio.html">proyectos</a>
        <a class="nav-link" href="#">nosotros</a>
        <a class="nav-link" href="mailto:espaciohumo@gmail.com">contacto</a>
        <a class="nav-link" href="login.html">portal clientes</a>
      </nav>
    </div>
    <div class="sidebar-contact">
      <a href="mailto:espaciohumo@gmail.com">espaciohumo@gmail.com</a>
      <a href="https://wa.me/5491169796742">+54 9 11 6979 6742</a>
      <a href="https://www.instagram.com/espaciohumo/" target="_blank" style="display:flex;align-items:center;gap:.4rem">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#002FA7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="#002FA7" stroke="none"/></svg>
        espaciohumo
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="hero" id="hero">
      <div class="hero-slides" id="hero-slides"></div>
      <div class="hero-overlay"></div>
      <h1 class="hero-title" id="hero-title">—</h1>
      <div class="hero-dots" id="hero-dots"></div>
    </div>

    <div class="content">
      <h2 class="project-name" id="p-nombre">—</h2>
      <div class="ficha">
        <div class="ficha-row"><span class="ficha-key">año_ </span><span class="ficha-val" id="f-anio">—</span></div>
        <div class="ficha-row"><span class="ficha-key">tipología_ </span><span class="ficha-val" id="f-tipo">—</span></div>
        <div class="ficha-row"><span class="ficha-key">estado_ </span><span class="ficha-val" id="f-estado">—</span></div>
        <div class="ficha-row"><span class="ficha-key">superficie_ </span><span class="ficha-val" id="f-sup">—</span></div>
        <div class="ficha-row" style="grid-column:1/-1"><span class="ficha-key">equipo_ </span><span class="ficha-val" id="f-equipo">—</span></div>
      </div>
      <div class="divider"></div>
      <p class="descripcion" id="p-desc"></p>

      <div class="galeria-label">Galería</div>
      <div class="masonry" id="masonry"></div>

      <nav class="project-nav">
        <a class="project-nav-item prev" id="nav-prev" href="#">
          <span class="project-nav-direction">proyecto anterior</span>
          <span class="project-nav-name" id="nav-prev-name">—</span>
        </a>
        <a class="project-nav-item next" id="nav-next" href="#">
          <span class="project-nav-direction">siguiente proyecto</span>
          <span class="project-nav-name" id="nav-next-name">—</span>
        </a>
      </nav>
    </div>
  </main>
</div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lb-close" onclick="closeLightbox()">×</button>
  <img id="lb-img" src="" alt=""/>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBWkrGK26Puv6e0ECJRO0BFjLMGsPJ6CvM",
  authDomain: "bacacay2784.firebaseapp.com",
  databaseURL: "https://bacacay2784-default-rtdb.firebaseio.com",
  projectId: "bacacay2784",
  storageBucket: "bacacay2784.firebasestorage.app",
  messagingSenderId: "19699091973",
  appId: "1:19699091973:web:bbea2d03e243e897f86a6c",
  measurementId: "G-8YH5N03016"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

const PROJECT_ID = new URLSearchParams(window.location.search).get('id');
const COL = 'portfolio'; // colección correcta

let slideIdx = 0;

function buildSlider(fotos){
  if(!fotos||!fotos.length) return;
  const slidesEl=document.getElementById('hero-slides');
  const dotsEl=document.getElementById('hero-dots');
  slidesEl.innerHTML=''; dotsEl.innerHTML='';
  fotos.forEach((f,i)=>{
    const s=document.createElement('div');
    s.className='hero-slide'+(i===0?' active':'');
    s.style.backgroundImage=`url('${f.src}')`;
    slidesEl.appendChild(s);
    const d=document.createElement('div');
    d.className='hero-dot'+(i===0?' active':'');
    d.onclick=()=>goSlide(i);
    dotsEl.appendChild(d);
  });
  if(fotos.length>1) setInterval(()=>goSlide((slideIdx+1)%fotos.length),4500);
}

function goSlide(n){
  document.querySelectorAll('.hero-slide')[slideIdx]?.classList.remove('active');
  document.querySelectorAll('.hero-dot')[slideIdx]?.classList.remove('active');
  slideIdx=n;
  document.querySelectorAll('.hero-slide')[slideIdx]?.classList.add('active');
  document.querySelectorAll('.hero-dot')[slideIdx]?.classList.add('active');
}

function buildMasonry(items){
  const grid=document.getElementById('masonry');
  grid.innerHTML='';
  if(!items||!items.length){
    grid.innerHTML='<p style="color:#aaa;font-size:.8rem">Sin imágenes cargadas aún.</p>';
    return;
  }
  items.forEach(item=>{
    const div=document.createElement('div');
    div.className='masonry-item';
    const img=document.createElement('img');
    img.src=item.src; img.alt=item.caption||''; img.loading='lazy';
    img.onclick=()=>openLightbox(item.src);
    div.appendChild(img);
    if(item.caption){
      const cap=document.createElement('div');
      cap.className='masonry-caption';
      cap.textContent=item.caption;
      div.appendChild(cap);
    }
    grid.appendChild(div);
  });
  const obs=new IntersectionObserver(entries=>{
    entries.forEach((e,i)=>{
      if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*60);obs.unobserve(e.target);}
    });
  },{threshold:0.05});
  grid.querySelectorAll('.masonry-item').forEach(el=>obs.observe(el));
}

async function init(){
  if(!PROJECT_ID){window.location.href='portfolio.html';return;}
  try{
    const doc=await db.collection(COL).doc(PROJECT_ID).get();
    if(!doc.exists){window.location.href='portfolio.html';return;}
    const p={id:doc.id,...doc.data()};

    document.title='espacio humo — '+(p.nombre||'');
    document.getElementById('hero-title').textContent=p.nombre||'—';
    document.getElementById('p-nombre').textContent=p.nombre||'—';
    document.getElementById('f-anio').textContent=p.anio||'—';
    document.getElementById('f-tipo').textContent=p.tipologia||'—';
    document.getElementById('f-estado').textContent=p.estado||'—';
    document.getElementById('f-sup').textContent=p.superficie||'—';
    document.getElementById('f-equipo').textContent=p.equipo||'—';
    document.getElementById('p-desc').textContent=p.descripcion||'';

    // Galería
    const [fSnap,pSnap]=await Promise.all([
      db.collection(COL).doc(PROJECT_ID).collection('galeria').orderBy('order','asc').get().catch(()=>({docs:[]})),
      db.collection(COL).doc(PROJECT_ID).collection('planos').orderBy('order','asc').get().catch(()=>({docs:[]}))
    ]);
    const fotos=fSnap.docs.map(d=>d.data());
    const planos=pSnap.docs.map(d=>d.data());

    // Hero: fotos de galería o cover
    const heroFotos=fotos.length?fotos:(p.coverUrl?[{src:p.coverUrl}]:[]);
    buildSlider(heroFotos);

    buildMasonry([...planos,...fotos]);
    await buildProjectNav();

    hideLoading();
    document.getElementById('app').style.display='block';
  }catch(e){
    console.error(e);
    hideLoading();
    document.getElementById('app').style.display='block';
  }
}

async function buildProjectNav(){
  try{
    const snap=await db.collection(COL).orderBy('order','asc').get();
    const all=snap.docs.map(d=>({id:d.id,...d.data()}));
    const idx=all.findIndex(p=>p.id===PROJECT_ID);
    const prev=idx>0?all[idx-1]:null;
    const next=idx<all.length-1?all[idx+1]:null;
    const prevEl=document.getElementById('nav-prev');
    const nextEl=document.getElementById('nav-next');
    if(prev){document.getElementById('nav-prev-name').textContent=prev.nombre||'—';prevEl.href=`proyecto.html?id=${prev.id}`;}
    else prevEl.style.visibility='hidden';
    if(next){document.getElementById('nav-next-name').textContent=next.nombre||'—';nextEl.href=`proyecto.html?id=${next.id}`;}
    else nextEl.style.visibility='hidden';
  }catch(e){console.warn(e);}
}

function hideLoading(){
  setTimeout(()=>{
    document.getElementById('loading-screen').classList.add('hide');
    setTimeout(()=>document.getElementById('loading-screen').style.display='none',700);
  },350);
}

function openLightbox(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

init();
</script>
</body>
</html>
