<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo — proyecto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:#0a0a0a;font-family:'Poppins',sans-serif;overflow-x:hidden}
:root{--accent:#002FA7;--border:#ebebeb;--sw:260px}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;background:#002FA7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease}
#loading-screen.hide{opacity:0;pointer-events:none}
.loading-logo{font-size:clamp(1.8rem,5vw,3rem);font-weight:300;color:#fff;letter-spacing:-.01em;margin-bottom:1.5rem}
.loading-dots{display:flex;gap:.5rem}
.loading-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);animation:dotPulse 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{background:rgba(255,255,255,.2);transform:scale(.8)}40%{background:#fff;transform:scale(1)}}

/* ── LAYOUT ── */
.layout{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sw);flex-shrink:0;
  height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:3rem 2.5rem;
  border-right:1px solid var(--border);
  background:#fff;z-index:10;
}
.sidebar-brand{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;color:#0a0a0a;text-decoration:none;display:block;margin-bottom:2.5rem;line-height:1;transition:opacity .2s}
.sidebar-brand:hover{opacity:.5}
.sidebar-brand span{color:var(--accent)}
.sidebar-nav{list-style:none;display:flex;flex-direction:column;gap:.05rem}
.sidebar-nav a{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;color:#0a0a0a;text-decoration:none;padding:.15rem 0;transition:opacity .2s;line-height:1.35;display:block}
.sidebar-nav a:hover{opacity:.35}
.sidebar-nav a.active{color:var(--accent)}
.sidebar-project{margin-top:auto;padding-top:2rem;border-top:1px solid var(--border)}
.sidebar-project-name{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:.2rem}
.sidebar-project-loc{font-size:.6rem;color:#aaa;font-weight:300}
.sidebar-contact{font-size:.62rem;line-height:2;color:#0a0a0a;margin-top:1.5rem}
.sidebar-contact a{color:var(--accent);text-decoration:none;transition:opacity .2s;display:block}
.sidebar-contact a:hover{opacity:.55}

/* ── MAIN ── */
.main{flex:1;min-width:0}

/* ── HERO ── */
.hero{
  position:relative;
  height:100svh;
  min-height:500px;
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.hero-slide{
  position:absolute;inset:0;
  opacity:0;transition:opacity .9s ease;
  background-size:cover;background-position:center;
}
.hero-slide.active{opacity:1}
.hero-overlay{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 2rem}
.hero-title{
  font-size:clamp(2.8rem,7vw,6.5rem);
  font-weight:300;
  color:#fff;
  letter-spacing:-.01em;
  line-height:1;
}
.hero-dots{
  position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  display:flex;gap:.6rem;z-index:3;
}
.hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .2s}
.hero-dot.active{background:#fff;transform:scale(1.2)}

/* ── DATOS ── */
.datos{padding:7rem var(--sw) 4rem 4rem}
.datos-nombre{
  font-size:clamp(2.5rem,5vw,4.5rem);
  font-weight:700;
  color:var(--accent);
  letter-spacing:-.02em;
  line-height:.95;
  margin-bottom:2.5rem;
}
.ficha{
  display:flex;flex-wrap:wrap;
  gap:.15rem 3rem;
  margin-bottom:2rem;
  font-size:.68rem;
}
.ficha-item{display:flex;gap:.4rem;align-items:baseline}
.ficha-key{color:#aaa;font-weight:300;font-style:italic}
.ficha-val{font-weight:700;color:#0a0a0a}
.separador{height:2px;background:var(--accent);margin-bottom:2.5rem;width:100%}
.descripcion{
  font-size:.85rem;line-height:1.95;
  color:#444;font-weight:300;
  max-width:600px;
  margin-bottom:0;
}

/* ── GALERÍA AIREADA ── */
.galeria{padding:5rem 0 5rem}
.masonry{
  columns:2;
  column-gap:3rem;
  padding:0 4rem;
}
.masonry-item{
  break-inside:avoid;
  margin-bottom:4rem;
  overflow:hidden;
  cursor:zoom-in;
  position:relative;
  opacity:0;
  transform:translateY(24px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);
}
/* Desfase orgánico — alterna alturas de inicio */
.masonry-item:nth-child(4n+1){margin-top:0}
.masonry-item:nth-child(4n+2){margin-top:5rem}
.masonry-item:nth-child(4n+3){margin-top:2rem}
.masonry-item:nth-child(4n+4){margin-top:8rem}
.masonry-item.visible{opacity:1;transform:translateY(0)}
.masonry-item img{width:100%;height:auto;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.masonry-item:hover img{transform:scale(1.02)}
.masonry-caption{
  font-size:.58rem;font-weight:300;font-style:italic;
  color:#aaa;letter-spacing:.04em;
  padding:.5rem 0 0;
}

/* ── CIERRE ── */
.cierre-img{
  width:100%;
  aspect-ratio:21/9;
  object-fit:cover;
  display:block;
  margin-top:3rem;
}
.related{
  padding:3.5rem 4rem;
  display:flex;gap:1.5rem;
}
.related-card{
  flex:1;
  text-decoration:none;
  overflow:hidden;
  position:relative;
  display:block;
}
.related-card-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  transition:transform .6s cubic-bezier(.16,1,.3,1);
}
.related-card:hover .related-card-img{transform:scale(1.04)}
.related-card-info{padding:.75rem 0}
.related-card-dir{font-size:.55rem;font-weight:300;font-style:italic;color:#aaa;margin-bottom:.2rem}
.related-card-name{font-size:.95rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.related-card-tipo{font-size:.6rem;font-weight:300;color:#888;margin-top:.1rem}

/* ── LIGHTBOX ── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:94vh;object-fit:contain}
#lb-close{position:absolute;top:1.2rem;right:1.4rem;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.8rem;cursor:pointer;line-height:1;transition:color .2s;font-family:inherit}
#lb-close:hover{color:#fff}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  :root{--sw:0px}
  .sidebar{display:none}
  .layout{flex-direction:column}
  .datos{padding:4rem 1.5rem 3rem}
  .masonry{columns:1;padding:0 1.5rem;column-gap:0}
  .masonry-item:nth-child(n){margin-top:0;margin-bottom:2.5rem}
  .related{flex-direction:column;padding:2rem 1.5rem}
  .cierre-img{aspect-ratio:16/9}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">espacio humo</div>
  <div class="loading-dots">
    <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
  </div>
</div>

<div id="app" style="display:none">
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <a class="sidebar-brand" href="index.html">espacio <span>humo</span></a>
      <ul class="sidebar-nav">
        <li><a href="portfolio.html" class="active">proyectos</a></li>
        <li><a href="#">nosotros</a></li>
        <li><a href="mailto:espaciohumo@gmail.com">contacto</a></li>
        <li><a href="login.html">portal clientes</a></li>
      </ul>
    </div>
    <div>
      <div class="sidebar-project">
        <div class="sidebar-project-name" id="sb-nombre">—</div>
        <div class="sidebar-project-loc" id="sb-loc">—</div>
      </div>
      <div class="sidebar-contact">
        <a href="mailto:espaciohumo@gmail.com">espaciohumo@gmail.com</a>
        <a href="https://wa.me/5491169796742">+54 9 11 6979 6742</a>
        <a href="https://www.instagram.com/espaciohumo/" target="_blank" style="display:flex;align-items:center;gap:.4rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="#002FA7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="#002FA7" stroke="none"/></svg>
          espaciohumo
        </a>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HERO FULLSCREEN -->
    <div class="hero" id="hero">
      <div id="hero-slides"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" id="hero-title">—</h1>
      </div>
      <div class="hero-dots" id="hero-dots"></div>
    </div>

    <!-- DATOS -->
    <div class="datos">
      <div class="datos-nombre" id="p-nombre">—</div>
      <div class="ficha" id="ficha">
        <div class="ficha-item"><span class="ficha-key">tipología</span><span class="ficha-val" id="f-tipo">—</span></div>
        <div class="ficha-item"><span class="ficha-key">año</span><span class="ficha-val" id="f-anio">—</span></div>
        <div class="ficha-item"><span class="ficha-key">estado</span><span class="ficha-val" id="f-estado">—</span></div>
        <div class="ficha-item"><span class="ficha-key">superficie</span><span class="ficha-val" id="f-sup">—</span></div>
        <div class="ficha-item"><span class="ficha-key">equipo</span><span class="ficha-val" id="f-equipo">—</span></div>
      </div>
      <div class="separador"></div>
      <p class="descripcion" id="p-desc"></p>
    </div>

    <!-- GALERÍA MASONRY AIREADA -->
    <div class="galeria">
      <div class="masonry" id="masonry"></div>
    </div>

    <!-- CIERRE: imagen full + relacionados -->
    <img class="cierre-img" id="cierre-img" src="" alt="" style="display:none"/>
    <div class="related" id="related"></div>

  </main>
</div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lb-close" onclick="closeLightbox()">×</button>
  <img id="lb-img" src="" alt=""/>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBWkrGK26Puv6e0ECJRO0BFjLMGsPJ6CvM",
  authDomain: "bacacay2784.firebaseapp.com",
  databaseURL: "https://bacacay2784-default-rtdb.firebaseio.com",
  projectId: "bacacay2784",
  storageBucket: "bacacay2784.firebasestorage.app",
  messagingSenderId: "19699091973",
  appId: "1:19699091973:web:bbea2d03e243e897f86a6c",
  measurementId: "G-8YH5N03016"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const COL = 'portfolio';
const PROJECT_ID = new URLSearchParams(window.location.search).get('id');
let slideIdx = 0;

// ── HERO SLIDER ──────────────────────────────────────────────────────────
function buildSlider(fotos){
  if(!fotos||!fotos.length) return;
  const slidesEl=document.getElementById('hero-slides');
  const dotsEl=document.getElementById('hero-dots');
  slidesEl.innerHTML=''; dotsEl.innerHTML='';
  fotos.forEach((f,i)=>{
    const s=document.createElement('div');
    s.className='hero-slide'+(i===0?' active':'');
    s.style.backgroundImage=`url('${f.src}')`;
    slidesEl.appendChild(s);
    const d=document.createElement('div');
    d.className='hero-dot'+(i===0?' active':'');
    d.onclick=()=>goSlide(i);
    dotsEl.appendChild(d);
  });
  if(fotos.length>1) setInterval(()=>goSlide((slideIdx+1)%fotos.length),4500);
}
function goSlide(n){
  document.querySelectorAll('.hero-slide')[slideIdx]?.classList.remove('active');
  document.querySelectorAll('.hero-dot')[slideIdx]?.classList.remove('active');
  slideIdx=n;
  document.querySelectorAll('.hero-slide')[slideIdx]?.classList.add('active');
  document.querySelectorAll('.hero-dot')[slideIdx]?.classList.add('active');
}

// ── MASONRY AIREADO ──────────────────────────────────────────────────────
function buildMasonry(items){
  const grid=document.getElementById('masonry');
  grid.innerHTML='';
  if(!items||!items.length){
    grid.innerHTML='<p style="color:#aaa;font-size:.8rem;padding:2rem 0">Sin imágenes cargadas aún.</p>';
    return;
  }
  items.forEach(item=>{
    const div=document.createElement('div');
    div.className='masonry-item';
    const img=document.createElement('img');
    img.src=item.src; img.alt=item.caption||''; img.loading='lazy';
    img.onclick=()=>openLightbox(item.src);
    div.appendChild(img);
    if(item.caption){
      const cap=document.createElement('div');
      cap.className='masonry-caption';
      cap.textContent=item.caption;
      div.appendChild(cap);
    }
    grid.appendChild(div);
  });
  const obs=new IntersectionObserver(entries=>{
    entries.forEach((e,i)=>{
      if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*80);obs.unobserve(e.target);}
    });
  },{threshold:0.04});
  grid.querySelectorAll('.masonry-item').forEach(el=>obs.observe(el));
}

// ── RELACIONADOS ─────────────────────────────────────────────────────────
async function buildRelated(currentProject, allProjects){
  // Busca proyectos de la misma tipología primero, luego cualquiera
  const others = allProjects.filter(p=>p.id!==currentProject.id);
  const sameType = others.filter(p=>p.tipologia===currentProject.tipologia);
  const pool = sameType.length>=2 ? sameType : others;
  // Tomar 2 al azar
  const shuffled = pool.sort(()=>Math.random()-.5).slice(0,2);
  if(!shuffled.length) return;

  // Imagen de cierre = cover del primer relacionado o del propio proyecto
  const cierreImg = document.getElementById('cierre-img');
  const cierreSrc = currentProject.coverUrl||currentProject.img||'';
  if(cierreSrc){ cierreImg.src=cierreSrc; cierreImg.style.display='block'; }

  const rel = document.getElementById('related');
  rel.innerHTML = shuffled.map(p=>`
    <a class="related-card" href="proyecto.html?id=${p.id}">
      <img class="related-card-img" src="${p.coverUrl||p.img||''}" alt="${esc(p.nombre||'')}"/>
      <div class="related-card-info">
        <div class="related-card-dir">proyecto relacionado</div>
        <div class="related-card-name">${esc(p.nombre||'')}</div>
        <div class="related-card-tipo">${esc(p.tipologia||'')} · ${esc(String(p.anio||''))}</div>
      </div>
    </a>`).join('');
}

// ── INIT ─────────────────────────────────────────────────────────────────
async function init(){
  if(!PROJECT_ID){window.location.href='portfolio.html';return;}
  try{
    const [doc, allSnap] = await Promise.all([
      db.collection(COL).doc(PROJECT_ID).get(),
      db.collection(COL).orderBy('order','asc').get()
    ]);
    if(!doc.exists){window.location.href='portfolio.html';return;}
    const p={id:doc.id,...doc.data()};
    const allProjects = allSnap.docs.map(d=>({id:d.id,...d.data()}));

    document.title='espacio humo — '+(p.nombre||'');
    document.getElementById('hero-title').textContent=p.nombre||'—';
    document.getElementById('p-nombre').textContent=p.nombre||'—';
    document.getElementById('sb-nombre').textContent=p.nombre||'—';
    document.getElementById('sb-loc').textContent=(p.barrio?p.barrio+' · ':'')+String(p.anio||'');
    document.getElementById('f-tipo').textContent=p.tipologia||'—';
    document.getElementById('f-anio').textContent=p.anio||'—';
    document.getElementById('f-estado').textContent=p.estado||'—';
    document.getElementById('f-sup').textContent=p.superficie||'—';
    document.getElementById('f-equipo').textContent=p.equipo||'—';
    document.getElementById('p-desc').textContent=p.descripcion||'';

    // Galería
    const [fSnap,pSnap]=await Promise.all([
      db.collection(COL).doc(PROJECT_ID).collection('galeria').orderBy('order','asc').get().catch(()=>({docs:[]})),
      db.collection(COL).doc(PROJECT_ID).collection('planos').orderBy('order','asc').get().catch(()=>({docs:[]}))
    ]);
    const fotos=fSnap.docs.map(d=>d.data());
    const planos=pSnap.docs.map(d=>d.data());

    // Hero: fotos de galería o cover
    const heroFotos=fotos.length?fotos:(p.coverUrl?[{src:p.coverUrl}]:[]);
    buildSlider(heroFotos);

    // Galería: planos + fotos mezclados
    buildMasonry([...planos,...fotos]);

    // Relacionados
    await buildRelated(p, allProjects);

    hideLoading();
    document.getElementById('app').style.display='block';
  }catch(e){
    console.error(e);
    hideLoading();
    document.getElementById('app').style.display='block';
  }
}

function hideLoading(){
  setTimeout(()=>{
    document.getElementById('loading-screen').classList.add('hide');
    setTimeout(()=>document.getElementById('loading-screen').style.display='none',700);
  },350);
}

function openLightbox(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

init();
</script>
</body>
</html>
