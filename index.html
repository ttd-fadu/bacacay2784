.center{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:2;
  padding:2rem;
}

/* MARCA — una sola linea */
.brand{
  font-family:'Poppins',sans-serif;
  font-weight:300;
  font-size:clamp(2.4rem,9vw,8rem);
  line-height:1;
  letter-spacing:.02em;
  white-space:nowrap;
  text-align:center;
  user-select:none;
  margin-bottom:clamp(1.5rem,4vw,3rem);
}
.brand-espacio{color:#fff}
.brand-sep{color:#fff;margin:0 .15em}
.brand-humo{color:#002FA7}

/* MENU */
nav{
  display:flex;
  align-items:center;
  gap:clamp(.75rem,2vw,2rem);
  flex-wrap:nowrap;
  justify-content:center;
}
.nav-link{
  font-family:'Poppins',sans-serif;
  font-weight:300;
  font-size:clamp(.5rem,.7vw,.65rem);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#fff;
  text-decoration:none;
  opacity:1;
  transition:opacity .25s ease;
  white-space:nowrap;
}
.nav-link:hover{opacity:.4}
.nav-sep{
  color:rgba(255,255,255,.35);
  font-size:.4rem;
  flex-shrink:0;
}

/* INSTAGRAM — pie de pagina centrado */
.ig-footer{
  position:fixed;
  bottom:1.5rem;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  gap:.5rem;
  z-index:2;
}
.ig-link{
  font-family:'Poppins',sans-serif;
  font-weight:300;
  font-size:clamp(.42rem,.55vw,.52rem);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  text-decoration:none;
  transition:color .2s;
  display:inline-flex;align-items:center;gap:.4rem;
}
.ig-link:hover{color:#fff}

/* MOBILE */
@media(max-width:500px){
  .brand{
    font-size:clamp(2.2rem,14vw,3.5rem);
    white-space:nowrap;
  }
  nav{
    gap:clamp(.5rem,2.5vw,1rem);
    flex-wrap:nowrap;
  }
  .nav-link{
    font-size:clamp(.42rem,1.8vw,.58rem);
    letter-spacing:.15em;
  }
}
