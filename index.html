<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins',sans-serif;background:#002FA7}

.bg{
  position:fixed;inset:0;
  background-image:url('');
  background-size:cover;background-position:center;
  transition:background-image .6s ease;
}
.bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.38);
}

.center{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:2;
}

.brand{
  font-size:clamp(3.5rem,10vw,9rem);
  font-weight:900;
  line-height:1;
  letter-spacing:-.03em;
  margin-bottom:3rem;
  text-align:center;
  user-select:none;
}
.brand-espacio{color:#fff}
.brand-humo{color:#002FA7}

/* cuando hay imagen de fondo, humo va en azul igual */
.has-bg .brand-humo{color:#002FA7;-webkit-text-stroke:2px #002FA7}

nav{
  display:flex;align-items:center;gap:2.5rem;
}
.nav-link{
  font-size:.72rem;
  font-weight:400;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#fff;
  text-decoration:none;
  opacity:1;
  transition:opacity .25s ease;
  position:relative;
  padding-bottom:2px;
}
.nav-link:hover{opacity:.45}
.nav-sep{color:rgba(255,255,255,.3);font-size:.5rem}

footer{
  position:fixed;bottom:1.5rem;left:0;right:0;
  text-align:center;
  font-size:.52rem;
  letter-spacing:.2em;
  color:rgba(255,255,255,.25);
  text-transform:uppercase;
  z-index:2;
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="center">
  <div class="brand">
    <span class="brand-espacio">espacio </span><span class="brand-humo">humo</span>
  </div>
  <nav>
    <a class="nav-link" href="portfolio.html">Proyectos</a>
    <span class="nav-sep">·</span>
    <a class="nav-link" href="https://www.instagram.com/espaciohumo/" target="_blank">Instagram</a>
    <span class="nav-sep">·</span>
    <a class="nav-link" href="login.html">Portal clientes</a>
  </nav>
</div>

<footer>espaciohumo.com.ar</footer>

<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

async function loadBg(){
  try{
    const doc = await db.collection('config').doc('home').get();
    if(doc.exists && doc.data().bgB64){
      const bg = document.getElementById('bg');
      bg.style.backgroundImage = "url('"+doc.data().bgB64+"')";
      document.body.classList.add('has-bg');
    }
  }catch(e){ console.log('No bg config'); }
}
loadBg();
</script>
</body>
</html>
