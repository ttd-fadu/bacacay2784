<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:#fff;color:#0a0a0a;min-height:100vh}
#loading-screen{position:fixed;inset:0;background:#002FA7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease}
#loading-screen.hide{opacity:0;pointer-events:none}
.loading-brand{font-size:clamp(2rem,6vw,4rem);font-weight:700;color:#fff;letter-spacing:-.02em;margin-bottom:1.5rem}
.loading-dots{display:flex;gap:.5rem}
.loading-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);animation:dp 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{background:rgba(255,255,255,.2);transform:scale(.75)}40%{background:#fff;transform:scale(1.1)}}
#login-wrap{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.login-card{width:100%;max-width:340px}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo img{height:34px;display:inline-block}
.login-tagline{font-size:.55rem;letter-spacing:.22em;color:#bbb;text-transform:uppercase;margin-top:.6rem;text-align:center}
.fl{display:block;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.35rem;margin-top:1.2rem}
.fi{width:100%;padding:.72rem .9rem;border:1px solid #d8d8d4;color:#0a0a0a;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s;background:#fff}
.fi:focus{border-color:#002FA7}
.login-btn{width:100%;padding:.82rem;background:#002FA7;color:#fff;font-size:.68rem;letter-spacing:.18em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;margin-top:1.5rem;transition:background .2s;font-family:inherit}
.login-btn:hover{background:#9E3A26}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:.65rem;color:#9E3A26;margin-top:.75rem;display:none;text-align:center;letter-spacing:.04em}
.back-link{display:block;text-align:center;margin-top:1.5rem;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:#ccc;text-decoration:none;transition:color .2s}
.back-link:hover{color:#002FA7}
</style>
</head>

      <div class="login-tagline">Portal de proyectos</div>
    </div>
    <label class="fl">Usuario</label>
    <input class="fi" type="email" id="l-email" placeholder="tu@email.com"/>
    <label class="fl">Contrasena</label>
    <input class="fi" type="password" id="l-pass" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="l-err">Usuario o contrasena incorrectos.</div>
    <a class="back-link" href="index.html">volver</a>
  </div>
</div>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);}
var db   = firebase.firestore();
var auth = firebase.auth();

// IMPORTANTE: Cerrar sesion existente al abrir login
// Esto evita que el admin que ya esta logueado sea redirigido automaticamente
auth.signOut().then(function(){
  // Sesion cerrada, mostrar formulario de login
  document.getElementById('loading-screen').classList.add('hide');
  setTimeout(function(){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('login-wrap').style.display='flex';
  },500);
});

function doLogin(){
  var email = document.getElementById('l-email').value.trim();
  var pass  = document.getElementById('l-pass').value;
  var err   = document.getElementById('l-err');
  var btn   = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.textContent = 'Ingresando...';
  btn.disabled = true;

  auth.signInWithEmailAndPassword(email, pass).then(function(cred){
    // Ocultar form, mostrar loading
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'flex';
    document.getElementById('loading-screen').classList.remove('hide');

    // Buscar si es cliente de algun proyecto
    return db.collection('projects').where('clientEmail','==',email).limit(1).get()
      .then(function(snap){
        if(!snap.empty){
          // Es cliente - ir al viewer de su proyecto
          window.location.replace('viewer.html?id='+snap.docs[0].id);
        } else {
          // Es admin - ir al panel
          window.location.replace('admin.html');
        }
      });
  }).catch(function(e){
    err.style.display = 'block';
    btn.textContent = 'Ingresar';
    btn.disabled = false;
  });
}
</script>
