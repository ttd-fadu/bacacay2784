<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo — Portal clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:#fff;color:#0a0a0a;min-height:100vh}

/* LOADING */
#loading-screen{
  position:fixed;inset:0;background:#002FA7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;transition:opacity .5s ease;
}
#loading-screen.hide{opacity:0;pointer-events:none}
.ld-brand{
  font-family:'Poppins',sans-serif;
  font-size:clamp(2rem,6vw,4rem);font-weight:900;
  color:#fff;letter-spacing:-.02em;margin-bottom:1.5rem;
}
.ld-brand span{color:#fff;opacity:.6}
.ld-dots{display:flex;gap:.5rem}
.ld-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.3);
  animation:dp 1.4s ease-in-out infinite;
}
.ld-dot:nth-child(2){animation-delay:.2s}
.ld-dot:nth-child(3){animation-delay:.4s}
@keyframes dp{
  0%,80%,100%{background:rgba(255,255,255,.2);transform:scale(.75)}
  40%{background:#fff;transform:scale(1.1)}
}

/* LOGIN */
#login-wrap{
  min-height:100vh;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;
}
.login-card{width:100%;max-width:340px}

.login-brand{
  font-family:'Poppins',sans-serif;
  font-size:2rem;font-weight:900;
  letter-spacing:-.02em;
  margin-bottom:.4rem;text-align:center;
}
.login-brand-espacio{color:#0a0a0a}
.login-brand-humo{color:#002FA7}

.login-tagline{
  font-family:'Poppins',sans-serif;
  font-size:.52rem;letter-spacing:.22em;
  color:#bbb;text-transform:uppercase;
  margin-bottom:2.5rem;text-align:center;
}

.fl{
  display:block;font-size:.52rem;letter-spacing:.18em;
  text-transform:uppercase;color:#888;font-weight:700;
  margin-bottom:.35rem;margin-top:1.2rem;
}
.fi{
  width:100%;padding:.72rem .9rem;
  border:1px solid #d8d8d4;color:#0a0a0a;
  font-size:.88rem;font-family:'Poppins',sans-serif;
  outline:none;transition:border-color .2s;background:#fff;
}
.fi:focus{border-color:#002FA7}

.login-btn{
  width:100%;padding:.82rem;
  background:#002FA7;color:#fff;
  font-size:.65rem;letter-spacing:.2em;font-weight:700;
  text-transform:uppercase;border:none;cursor:pointer;
  margin-top:1.5rem;transition:background .2s;
  font-family:'Poppins',sans-serif;
}
.login-btn:hover{background:#9E3A26}
.login-btn:disabled{opacity:.5;cursor:not-allowed}

.login-err{
  font-size:.62rem;color:#9E3A26;
  margin-top:.75rem;display:none;
  text-align:center;letter-spacing:.04em;
}
.back-link{
  display:block;text-align:center;margin-top:1.5rem;
  font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;
  color:#ccc;text-decoration:none;transition:color .2s;
  font-family:'Poppins',sans-serif;
}
.back-link:hover{color:#002FA7}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="ld-brand">espacio <span>humo</span></div>
  <div class="ld-dots">
    <div class="ld-dot"></div>
    <div class="ld-dot"></div>
    <div class="ld-dot"></div>
  </div>
</div>

<div id="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-espacio">espacio </span><span class="login-brand-humo">humo</span>
    </div>
    <div class="login-tagline">portal de proyectos</div>

    <label class="fl">Usuario</label>
    <input class="fi" type="email" id="l-email" placeholder="tu@email.com"/>
    <label class="fl">Contrasena</label>
    <input class="fi" type="password" id="l-pass" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="l-err">Usuario o contrasena incorrectos.</div>
    <a class="back-link" href="index.html">volver</a>
  </div>
</div>

<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);}
var db   = firebase.firestore();
var auth = firebase.auth();

// Cerrar sesion existente primero — evita que admin logueado
// sea redirigido automaticamente sin ver el formulario
auth.signOut().then(function(){
  document.getElementById('loading-screen').classList.add('hide');
  setTimeout(function(){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('login-wrap').style.display='flex';
  },500);
});

function doLogin(){
  var email = document.getElementById('l-email').value.trim();
  var pass  = document.getElementById('l-pass').value;
  var err   = document.getElementById('l-err');
  var btn   = document.getElementById('login-btn');
  err.style.display='none';
  btn.textContent='Ingresando...';
  btn.disabled=true;

  auth.signInWithEmailAndPassword(email, pass).then(function(){
    // Mostrar loading mientras buscamos
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('loading-screen').style.display='flex';
    document.getElementById('loading-screen').classList.remove('hide');

    // Buscar si es cliente de algun proyecto
    return db.collection('projects')
      .where('clientEmail','==', email)
      .limit(1).get();
  }).then(function(snap){
    if(snap && !snap.empty){
      // Es cliente — ir al viewer de su proyecto
      window.location.replace('viewer.html?id='+snap.docs[0].id);
    } else {
      // Es admin — ir al panel
      window.location.replace('admin.html');
    }
  }).catch(function(){
    err.style.display='block';
    btn.textContent='Ingresar';
    btn.disabled=false;
    document.getElementById('login-wrap').style.display='flex';
    document.getElementById('loading-screen').style.display='none';
  });
}
</script>
</body>
</html>
