<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo — Proyectos</title> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins',sans-serif;color:#0a0a0a;background:#fff;display:flex}

/* ── SIDEBAR ── */
.sidebar{
  width:280px;flex-shrink:0;
  height:100vh;
  padding:3rem 2.5rem;
  display:flex;flex-direction:column;
  justify-content:space-between;
  border-right:1px solid #ebebeb;
  background:#fff;
  position:relative;z-index:10;
}

.sidebar-brand{
  font-size:1.05rem;font-weight:700;
  letter-spacing:-.01em;
  color:#0a0a0a;
  margin-bottom:2.5rem;
  line-height:1;
  text-decoration:none;
  display:block;
  transition:opacity .2s;
}
.sidebar-brand:hover{opacity:.5}
.sidebar-brand span{color:#002FA7}

nav{display:flex;flex-direction:column;gap:.05rem}

.nav-link{
  font-size:1.4rem;font-weight:700;
  letter-spacing:-.02em;
  color:#0a0a0a;text-decoration:none;
  padding:.15rem 0;
  transition:opacity .2s;
  line-height:1.35;
}
.nav-link:hover{opacity:.35}
.nav-link.active{color:#002FA7}

/* Buscador */
.search-wrap{
  margin-top:2rem;
  position:relative;
}
.search-icon{
  position:absolute;
  left:0;top:50%;transform:translateY(-50%);
  width:20px;height:20px;
  pointer-events:none;
}
.search-icon svg{width:18px;height:18px;stroke:#002FA7;fill:none;stroke-width:2}
.search-input{
  width:100%;
  padding:.4rem 0 .4rem 1.6rem;
  border:none;
  border-bottom:1px solid #002FA7;
  background:transparent;
  font-family:'Poppins',sans-serif;
  font-size:.78rem;
  color:#0a0a0a;
  outline:none;
  letter-spacing:.02em;
}
.search-input::placeholder{color:#aaa;font-style:italic}

.sidebar-contact{
  font-size:.68rem;
  line-height:2.1;
  color:#0a0a0a;
}
.sidebar-contact a{
  color:#002FA7;text-decoration:none;
  transition:opacity .2s;
  display:block;
}
.sidebar-contact a:hover{opacity:.55}

/* ── GRID ── */
.grid-wrap{
  flex:1;
  height:100vh;
  overflow-y:auto;
  padding:2rem 2rem 4rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.75rem;
}

.proj-card{
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.proj-card-img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  transition:transform .5s cubic-bezier(.16,1,.3,1);
  background:#e8e8e4;
}
.proj-card:hover .proj-card-img{transform:scale(1.05)}
.proj-card-info{padding:.55rem 0 1rem}
.proj-tipo{font-size:.72rem;font-weight:300;font-style:italic;color:#0a0a0a;line-height:1.4}
.proj-nombre{font-size:.72rem;font-weight:300;font-style:italic;color:#0a0a0a}
.proj-year{font-size:.72rem;font-weight:700;color:#0a0a0a}

.no-results{
  grid-column:1/-1;
  padding:4rem 0;
  text-align:center;
  font-size:.82rem;
  color:#aaa;
  font-style:italic;
}

/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:85vh;object-fit:contain}
#lb-caption{color:rgba(255,255,255,.5);font-size:.65rem;letter-spacing:.12em;margin-top:1rem;text-transform:uppercase;font-family:'Poppins',sans-serif}
#lb-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.8rem;cursor:pointer;line-height:1;transition:color .2s;font-family:inherit}
#lb-close:hover{color:#fff}

@media(max-width:900px){
  html,body{overflow:auto}
  body{flex-direction:column}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid #ebebeb;padding:2rem}
  .grid-wrap{height:auto;overflow:visible;padding:1.5rem}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div>
    <a class="sidebar-brand" href="index.html">espacio <span>humo</span></a>
    <nav>
      <a class="nav-link active" href="portfolio.html">proyectos</a>
      <a class="nav-link" href="#">nosotros</a>
      <a class="nav-link" href="mailto:espaciohumo@gmail.com">contacto</a>
      <a class="nav-link" href="login.html">portal clientes</a>
    </nav>
    <div class="search-wrap">
      <div class="search-icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      </div>
      <input class="search-input" type="text" id="search-input" placeholder="buscar proyecto..." oninput="filterProjects()"/>
    </div>
  </div>
  <div class="sidebar-contact">
    <a href="mailto:espaciohumo@gmail.com">espaciohumo@gmail.com</a>
    <a href="https://wa.me/5491169796742">+54 9 11 6979 6742</a>
    <a href="https://www.instagram.com/espaciohumo/" target="_blank" style="display:flex;align-items:center;gap:.4rem">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#002FA7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="#002FA7" stroke="none"/></svg>
      espaciohumo
    </a>
  </div>
</aside>

<div class="grid-wrap">
  <div class="grid" id="portfolio-grid">
    <div class="no-results" style="color:#ccc;font-style:normal;font-size:.75rem">Cargando proyectos...</div>
  </div>
</div>

<div id="lightbox" onclick="closeLb()">
  <button id="lb-close" onclick="closeLb()">×</button>
  <img id="lb-img" src="" alt=""/>
  <div id="lb-caption"></div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBWkrGK26Puv6e0ECJRO0BFjLMGsPJ6CvM",
  authDomain: "bacacay2784.firebaseapp.com",
  databaseURL: "https://bacacay2784-default-rtdb.firebaseio.com",
  projectId: "bacacay2784",
  storageBucket: "bacacay2784.firebasestorage.app",
  messagingSenderId: "19699091973",
  appId: "1:19699091973:web:bbea2d03e243e897f86a6c",
  measurementId: "G-8YH5N03016"
};
</script>
<script>
const EJEMPLO = [
  { img:'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800', tipo:'interiorismo', nombre:'Palermo', year:'2024' },
  { img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800', tipo:'arquitectura', nombre:'San Telmo', year:'2023' },
  { img:'https://images.unsplash.com/photo-1618219908412-a29a1bb7b86e?w=800', tipo:'diseño comercial', nombre:'Villa Crespo', year:'2024' },
  { img:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800', tipo:'vivienda', nombre:'Belgrano', year:'2022' },
  { img:'https://images.unsplash.com/photo-1567767292278-a4f21aa2d36e?w=800', tipo:'interiorismo', nombre:'Nunez', year:'2023' },
  { img:'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=800', tipo:'reforma', nombre:'Recoleta', year:'2024' },
  { img:'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800', tipo:'arquitectura', nombre:'Caballito', year:'2022' },
  { img:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=800', tipo:'diseño comercial', nombre:'Colegiales', year:'2023' },
  { img:'https://images.unsplash.com/photo-1565182999561-18d7dc61c393?w=800', tipo:'vivienda', nombre:'Almagro', year:'2024' },
];

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

let allItems = [];

async function loadPortfolio(){
  const grid = document.getElementById('portfolio-grid');
  try{
    const snap = await db.collection('portfolio').orderBy('order','asc').get();
    allItems = snap.empty ? EJEMPLO : snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    allItems = EJEMPLO;
  }
  renderGrid(allItems);
}

function renderGrid(items){
  const grid = document.getElementById('portfolio-grid');
  if(!items.length){
    grid.innerHTML = '<div class="no-results">Sin resultados.</div>';
    return;
  }
  grid.innerHTML = items.map((p,i)=>`
    <div class="proj-card" onclick="goProject('${p.id||''}','${p.img||p.coverUrl||''}','${(p.tipo||'')} · ${(p.nombre||p.name||'')} · ${p.year||p.año||''}')">
      <img class="proj-card-img" src="${p.img||p.coverUrl||''}" alt="${p.nombre||''}" loading="${i<6?'eager':'lazy'}"/>
      <div class="proj-card-info">
        <div class="proj-tipo">${p.tipo||p.categoria||''}</div>
        <div class="proj-nombre">${p.nombre||p.name||''}</div>
        <div class="proj-year">${p.year||p.año||''}</div>
      </div>
    </div>`).join('');
}

function filterProjects(){
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if(!q){ renderGrid(allItems); return; }
  const filtered = allItems.filter(p=>{
    const txt = ((p.tipo||'')+(p.nombre||p.name||'')+(p.year||p.año||'')+(p.categoria||'')).toLowerCase();
    return txt.includes(q);
  });
  renderGrid(filtered);
}

function goProject(id, src, caption){
  if(id) { window.location.href = 'proyecto.html?id=' + id; return; }
  // fallback para items de ejemplo sin id: abre lightbox
  openLb(src, caption);
}

function openLb(src,caption){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-caption').textContent=caption;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

loadPortfolio();
</script>
</body>
</html>
