<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>espacio humo — Panel de proyectos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f7f6f4;color:#0a0a0a;min-height:100vh}
:root{--klein:#002FA7;--terra:#9E3A26;--border:#e0dedd;--gray:#f7f6f4}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--klein)}
.login-box{width:100%;max-width:380px;padding:3rem;background:#fff;border-bottom:4px solid var(--terra)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo img{height:44px;display:inline-block}
.fl{display:block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.35rem;margin-top:1.2rem}
.fi,.fsel,.fta{width:100%;padding:.65rem .8rem;border:1px solid var(--border);color:#0a0a0a;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s;background:#fff}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--klein)}
.fta{resize:vertical;min-height:80px}
.login-btn{width:100%;padding:.85rem;background:var(--klein);color:#fff;font-size:.72rem;letter-spacing:.15em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;margin-top:1.5rem;transition:background .2s}
.login-btn:hover{background:var(--terra)}
.login-err{font-size:.68rem;color:var(--terra);margin-top:.75rem;display:none;text-align:center}

#admin-ui{display:none}
.topbar{background:var(--klein);padding:0 2.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;border-bottom:2px solid var(--terra)}
.topbar-logo{font-size:1rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.topbar-right{display:flex;align-items:center;gap:1rem}
.topbar-user{font-size:.58rem;color:rgba(255,255,255,.4);letter-spacing:.08em}
.btn-top{padding:.38rem .85rem;font-size:.6rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.btn-top:hover{background:rgba(255,255,255,.2);color:#fff}

.main{max-width:1200px;margin:0 auto;padding:3rem 2.5rem}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.page-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.page-sub{font-size:.68rem;color:#888;margin-top:.2rem;letter-spacing:.04em}
.btn-primary{padding:.7rem 1.5rem;background:var(--klein);color:#fff;font-size:.68rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:var(--terra)}
.btn-secondary{padding:.7rem 1.5rem;background:transparent;color:#0a0a0a;font-size:.68rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.btn-secondary:hover{border-color:#0a0a0a;background:#0a0a0a;color:#fff}

.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
.project-card{background:#fff;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.project-card:hover{box-shadow:0 8px 32px rgba(0,47,167,.1);transform:translateY(-2px)}
.project-color-bar{height:4px}
.project-card-img{width:100%;height:190px;object-fit:cover;display:block;background:#e8e8e4}
.project-card-img-placeholder{width:100%;height:190px;background:linear-gradient(135deg,var(--klein) 0%,#001a6e 100%);display:flex;align-items:center;justify-content:center}
.project-card-img-placeholder span{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:700}
.project-card-body{padding:1.25rem}
.project-card-tag{font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:.4rem}
.tag-active{color:var(--klein)}
.tag-presentation{color:var(--terra)}
.tag-completed{color:#888}
.project-card-title{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.2rem}
.project-card-address{font-size:.72rem;color:#888;margin-bottom:1rem}
.project-card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:.75rem;border-top:1px solid var(--border)}
.project-stats{display:flex;gap:1.5rem}
.pstat{text-align:center}
.pstat-num{font-size:1.2rem;font-weight:700;display:block;line-height:1}
.pstat-label{font-size:.52rem;letter-spacing:.1em;color:#888;text-transform:uppercase}
.card-actions{display:flex;gap:.5rem}
.btn-card{padding:.35rem .7rem;font-size:.58rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s}
.btn-card-blue{background:var(--klein);color:#fff}.btn-card-blue:hover{background:#001a6e}
.btn-card-terra{background:transparent;color:var(--terra);border:1px solid var(--terra)}.btn-card-terra:hover{background:var(--terra);color:#fff}

.empty-state{grid-column:1/-1;text-align:center;padding:6rem 2rem;color:#aaa}
.empty-text{font-size:.9rem;letter-spacing:.03em}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;border-top:4px solid var(--klein)}
.modal-header{padding:1.5rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10}
.modal-title{font-size:1.1rem;font-weight:700}
.btn-close{width:32px;height:32px;background:var(--gray);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-close:hover{background:var(--terra);color:#fff}
.modal-body{padding:2rem}
.modal-footer{padding:1.25rem 2rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem;position:sticky;bottom:0;background:#fff}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.field-col{margin-bottom:1.25rem}
.color-row{display:flex;align-items:center;gap:.75rem}
.color-swatch{width:36px;height:36px;border:1px solid var(--border);flex-shrink:0;cursor:pointer}
.pass-row{display:flex;gap:.5rem}
.pass-row .fi{flex:1}
.btn-gen{padding:.65rem .9rem;background:var(--gray);border:1px solid var(--border);cursor:pointer;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:all .2s}
.btn-gen:hover{background:var(--klein);color:#fff;border-color:var(--klein)}
.cred-box{background:var(--gray);border:1px solid var(--border);padding:1.25rem;margin-top:1rem}
.cred-title{font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#888;margin-bottom:.75rem}
.cred-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem}
.cred-item:last-child{border-bottom:none}
.cred-val{font-family:monospace;font-size:.85rem;font-weight:700;color:var(--klein)}
.img-drop{border:2px dashed var(--border);padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:.5rem}
.img-drop:hover,.img-drop.over{border-color:var(--klein);background:#f0f4ff}
.img-drop-label{font-size:.75rem;color:#888}
.img-drop-label strong{color:#0a0a0a}
.img-prev{width:100%;max-height:140px;object-fit:cover;display:block;border:1px solid var(--border);margin-bottom:.5rem}
.section-divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0}

.toast{position:fixed;bottom:2rem;right:2rem;background:#0a0a0a;color:#fff;padding:.9rem 1.5rem;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border-left:3px solid var(--klein);opacity:0;transform:translateY(8px);transition:all .3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:700px){.projects-grid{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}}
</style>
</head>

<div id="admin-ui">
  <div class="topbar">
    <div class="topbar-logo">espacio humo</div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn-top" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Proyectos</div>
        <div class="page-sub">Panel de gestión — espacio humo</div>
      </div>
      <button class="btn-primary" onclick="openNewProject()">+ Crear proyecto</button>
    </div>
    <div class="projects-grid" id="projects-grid">

</div>

<!-- MODAL -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Nuevo proyecto</div>
      <button class="btn-close" onclick="closeModal()">x</button>
    </div>
    <div class="modal-body">
      <div class="field-col">
        <label class="fl">Imagen de portada</label>
        <img id="cover-prev" src="" style="display:none" class="img-prev"/>
        <div class="img-drop" id="cover-drop"
             onclick="document.getElementById('cover-file').click()"
             ondragover="event.preventDefault();this.classList.add('over')"
             ondragleave="this.classList.remove('over')"
             ondrop="handleCoverDrop(event)">
          <div class="img-drop-label"><strong>Clic o arrastrá</strong> la imagen de portada</div>
        </div>
        <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="handleCoverFile(this)"/>
      </div>
      <div class="field-row">
        <div><label class="fl">Nombre del proyecto</label><input class="fi" id="m-nombre" placeholder="Bacacay 2784"/></div>
        <div><label class="fl">Dirección</label><input class="fi" id="m-dir" placeholder="Bacacay 2784, Flores"/></div>
      </div>
      <div class="field-row">
        <div><label class="fl">Barrio / Ciudad</label><input class="fi" id="m-barrio" placeholder="Flores, Buenos Aires"/></div>
        <div>
          <label class="fl">Estado</label>
          <select class="fsel" id="m-estado">
            <option value="presentation">Presentacion</option>
            <option value="active">En obra</option>
            <option value="completed">Finalizado</option>
          </select>
        </div>
      </div>
      <div class="field-col">
        <label class="fl">Descripcion breve</label>
        <textarea class="fta" id="m-desc" placeholder="Descripcion del proyecto..."></textarea>
      </div>
      <div class="field-col">
        <label class="fl">Color de acento del proyecto</label>
        <div class="color-row">
          <input type="color" id="m-color" value="#002FA7" style="width:48px;height:36px;border:1px solid var(--border);cursor:pointer;padding:2px"/>
          <input class="fi" id="m-color-hex" value="#002FA7" style="width:110px"/>
          <div class="color-swatch" id="color-swatch" style="background:#002FA7"></div>
          <span style="font-size:.68rem;color:#888;flex:1">Color de barras, badges y acentos en la landing del cliente.</span>
        </div>
      </div>
      <hr class="section-divider"/>
      <div class="field-col">
        <label class="fl">Email del cliente</label>
        <input class="fi" id="m-client-email" type="email" placeholder="cliente@email.com"/>
      </div>
      <div class="field-col">
        <label class="fl">Contrasena</label>
        <div class="pass-row">
          <input class="fi" id="m-client-pass" type="text" placeholder="Contrasena para el cliente"/>
          <button class="btn-gen" onclick="generatePassword()">Generar</button>
        </div>
      </div>
      <div class="cred-box" id="cred-box" style="display:none">
        <div class="cred-title">Credenciales para entregar al cliente</div>
        <div class="cred-item"><span>URL</span><span class="cred-val" id="cred-url">—</span></div>
        <div class="cred-item"><span>Usuario</span><span class="cred-val" id="cred-email">—</span></div>
        <div class="cred-item"><span>Contrasena</span><span class="cred-val" id="cred-pass">—</span></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveProject()">Guardar proyecto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db   = firebase.firestore();
const auth  = firebase.auth();

let projects = [];
let editingId = null;
let currentCoverB64 = null;

function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  auth.signInWithEmailAndPassword(email,pass)
    .then(u=>{
      document.getElementById('login-screen').style.display='none';
      document.getElementById('admin-ui').style.display='block';
      document.getElementById('topbar-user').textContent=u.user.email;
      loadProjects();
    })
    .catch(()=>{document.getElementById('l-err').style.display='block';});
}
function doLogout(){auth.signOut().then(()=>location.reload());}

async function loadProjects(){
  try{
    const snap=await db.collection('projects').orderBy('createdAt','desc').get();
    projects=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderGrid();
  }catch(e){toast('Error: '+e.message);}
}

function renderGrid(){
  const grid=document.getElementById('projects-grid');
  if(!projects.length){
    grid.innerHTML='<div class="empty-state"><div class="empty-text">No hay proyectos. Crea el primero.</div></div>';
    return;
  }
  const tagMap={presentation:'En presentacion',active:'En obra',completed:'Finalizado'};
  const tagClass={presentation:'tag-presentation',active:'tag-active',completed:'tag-completed'};
  grid.innerHTML=projects.map(p=>`
    <div class="project-card">
      <div class="project-color-bar" style="background:${p.color||'#002FA7'}"></div>
      ${p.coverB64
        ?`<img class="project-card-img" src="${p.coverB64}" alt="${p.nombre||''}"/>`
        :`<div class="project-card-img-placeholder"><span>sin imagen</span></div>`}
      <div class="project-card-body">
        <div class="project-card-tag ${tagClass[p.estado]||'tag-presentation'}">${tagMap[p.estado]||''}</div>
        <div class="project-card-title">${p.nombre||'Sin nombre'}</div>
        <div class="project-card-address">${p.direccion||''}</div>
        <div class="project-card-footer">
          <div class="project-stats">
            <div class="pstat"><span class="pstat-num">${p.informeCount||0}</span><span class="pstat-label">Informes</span></div>
            <div class="pstat"><span class="pstat-num">${p.pctGlobal||0}%</span><span class="pstat-label">Avance</span></div>
          </div>
          <div class="card-actions">
            <button class="btn-card btn-card-blue" onclick="openProject('${p.id}')">Abrir</button>
            <button class="btn-card btn-card-terra" onclick="event.stopPropagation();openEdit('${p.id}')">Editar</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function openProject(id){window.location.href='project-admin.html?id='+id;}

function openNewProject(){
  editingId=null; currentCoverB64=null;
  document.getElementById('modal-title').textContent='Nuevo proyecto';
  ['m-nombre','m-dir','m-barrio','m-desc','m-client-email','m-client-pass'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-estado').value='presentation';
  document.getElementById('m-color').value='#002FA7';
  document.getElementById('m-color-hex').value='#002FA7';
  document.getElementById('color-swatch').style.background='#002FA7';
  document.getElementById('cred-box').style.display='none';
  document.getElementById('cover-prev').style.display='none';
  document.getElementById('project-modal').classList.add('open');
}

function openEdit(id){
  const p=projects.find(x=>x.id===id); if(!p) return;
  editingId=id; currentCoverB64=p.coverB64||null;
  document.getElementById('modal-title').textContent='Editar proyecto';
  document.getElementById('m-nombre').value=p.nombre||'';
  document.getElementById('m-dir').value=p.direccion||'';
  document.getElementById('m-barrio').value=p.barrio||'';
  document.getElementById('m-desc').value=p.descripcion||'';
  document.getElementById('m-estado').value=p.estado||'presentation';
  document.getElementById('m-color').value=p.color||'#002FA7';
  document.getElementById('m-color-hex').value=p.color||'#002FA7';
  document.getElementById('color-swatch').style.background=p.color||'#002FA7';
  document.getElementById('m-client-email').value=p.clientEmail||'';
  document.getElementById('m-client-pass').value=p.clientPass||'';
  if(p.clientEmail&&p.clientPass) showCreds(p.clientEmail,p.clientPass);
  if(currentCoverB64){document.getElementById('cover-prev').src=currentCoverB64;document.getElementById('cover-prev').style.display='block';}
  else document.getElementById('cover-prev').style.display='none';
  document.getElementById('project-modal').classList.add('open');
}

function closeModal(){document.getElementById('project-modal').classList.remove('open');}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('m-color').addEventListener('input',function(){
    document.getElementById('m-color-hex').value=this.value;
    document.getElementById('color-swatch').style.background=this.value;
  });
  document.getElementById('m-color-hex').addEventListener('input',function(){
    if(/^#[0-9A-Fa-f]{6}$/.test(this.value)){
      document.getElementById('m-color').value=this.value;
      document.getElementById('color-swatch').style.background=this.value;
    }
  });
  document.getElementById('m-client-email').addEventListener('input',updateCreds);
  document.getElementById('m-client-pass').addEventListener('input',updateCreds);
});

function updateCreds(){
  const e=document.getElementById('m-client-email').value;
  const p=document.getElementById('m-client-pass').value;
  if(e&&p) showCreds(e,p);
}
function showCreds(email,pass){
  document.getElementById('cred-url').textContent=window.location.origin+'/login.html';
  document.getElementById('cred-email').textContent=email;
  document.getElementById('cred-pass').textContent=pass;
  document.getElementById('cred-box').style.display='block';
}
function generatePassword(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let p='';for(let i=0;i<10;i++)p+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('m-client-pass').value=p;
  updateCreds();
}

function handleCoverDrop(e){e.preventDefault();document.getElementById('cover-drop').classList.remove('over');handleCoverFile({files:e.dataTransfer.files});}
async function handleCoverFile(input){
  const file=input.files[0];if(!file)return;
  currentCoverB64=await compressImage(file,1200,82);
  document.getElementById('cover-prev').src=currentCoverB64;
  document.getElementById('cover-prev').style.display='block';
}

async function saveProject(){
  const nombre=document.getElementById('m-nombre').value.trim();
  if(!nombre){toast('El nombre es obligatorio');return;}
  const data={
    nombre,
    direccion:document.getElementById('m-dir').value.trim(),
    barrio:document.getElementById('m-barrio').value.trim(),
    descripcion:document.getElementById('m-desc').value.trim(),
    estado:document.getElementById('m-estado').value,
    color:document.getElementById('m-color-hex').value||'#002FA7',
    clientEmail:document.getElementById('m-client-email').value.trim(),
    clientPass:document.getElementById('m-client-pass').value.trim(),
    coverB64:currentCoverB64,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
  };
  try{
    if(editingId){
      await db.collection('projects').doc(editingId).update(data);
      const idx=projects.findIndex(p=>p.id===editingId);
      if(idx>=0)projects[idx]={...projects[idx],...data};
      toast('Proyecto actualizado');
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      data.informeCount=0;data.pctGlobal=0;
      const ref=await db.collection('projects').add(data);
      projects.unshift({id:ref.id,...data});
      toast('Proyecto creado');
    }
    renderGrid();closeModal();
  }catch(e){toast('Error: '+e.message);}
}

function compressImage(file,maxW,q){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const r=Math.min(maxW/img.width,1),c=document.createElement('canvas');
      c.width=img.width*r;c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',q/100));
    };img.src=url;
  });
}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
</script>
