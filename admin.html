<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Bacacay 2784</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f4f4f2;color:#0a0a0a;min-height:100vh}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a}
.login-box{width:100%;max-width:380px;padding:3rem;background:#111;border-top:3px solid #F5C000}
.login-logo{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.25rem}
.login-logo span{color:#F5C000}
.login-sub{font-size:.62rem;letter-spacing:.18em;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:2.5rem}
.login-label{display:block;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:700;margin-bottom:.4rem;margin-top:1.25rem}
.login-input{width:100%;padding:.8rem 1rem;background:#1a1a1a;border:1px solid #333;color:#fff;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.login-input:focus{border-color:#F5C000}
.login-btn{width:100%;padding:.9rem;background:#F5C000;color:#0a0a0a;font-size:.75rem;letter-spacing:.15em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;margin-top:1.5rem}
.login-btn:hover{opacity:.85}
.login-err{font-size:.7rem;color:#ff6b6b;margin-top:.75rem;display:none}
#admin-ui{display:none}
.topbar{background:#0a0a0a;padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #F5C000;position:sticky;top:0;z-index:200}
.topbar-logo{font-size:1rem;font-weight:700;color:#fff}
.topbar-logo span{color:#F5C000}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.topbar-user{font-size:.6rem;color:rgba(255,255,255,.35);letter-spacing:.08em}
.btn-sm{padding:.4rem .9rem;font-size:.62rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.btn-white{background:#fff;color:#0a0a0a}.btn-white:hover{background:#F5C000}
.btn-yellow{background:#F5C000;color:#0a0a0a}.btn-yellow:hover{opacity:.85}
.btn-danger{background:#ff6b6b;color:#fff}
.main-layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px)}
.sidebar{background:#fff;border-right:1px solid #e0e0dc;display:flex;flex-direction:column}
.sidebar-inner{padding:1.5rem;flex:1;overflow-y:auto}
.sidebar-title{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;font-weight:700;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid #eee}
.report-list{list-style:none;margin-bottom:1rem}
.rli{padding:.7rem .9rem;cursor:pointer;border-radius:4px;transition:background .15s;margin-bottom:.2rem}
.rli:hover{background:#f4f4f2}
.rli.active{background:#0a0a0a;color:#fff}
.rli.active .rli-num{color:#F5C000}
.rli-num{font-size:.6rem;font-weight:700;letter-spacing:.1em;color:#F5C000}
.rli-title{font-size:.82rem;font-weight:700}
.rli-date{font-size:.58rem;color:#888}
.rli.active .rli-date{color:rgba(255,255,255,.4)}
.btn-new{display:block;width:100%;padding:.8rem;text-align:center;background:#0a0a0a;color:#fff;font-size:.65rem;letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;margin-top:auto}
.btn-new:hover{background:#F5C000;color:#0a0a0a}
.content{padding:2rem 2.5rem;max-width:900px}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid #d0d0cc;flex-wrap:wrap;gap:1rem}
.content-title{font-size:1.4rem;font-weight:700}
.content-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.fs{background:#fff;padding:1.5rem;margin-bottom:1.25rem;border:1px solid #e0e0dc}
.fs-title{font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem}
.fs-title::after{content:'';flex:1;height:1px;background:#eee}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.field-col{margin-bottom:1.25rem}
.fl{display:block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:.35rem}
.fi{width:100%;padding:.65rem .8rem;background:#fff;border:1px solid #d0d0cc;color:#0a0a0a;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus{border-color:#F5C000}
.prog-item{background:#f9f9f7;border:1px solid #e8e8e4;padding:1rem;margin-bottom:.75rem}
.prog-item-header{display:grid;grid-template-columns:1fr 70px 32px;gap:.75rem;align-items:center;margin-bottom:.6rem}
.prog-slider{-webkit-appearance:none;width:100%;height:4px;background:#d0d0cc;outline:none;cursor:pointer;margin-bottom:.5rem}
.prog-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#F5C000;border-radius:50%;cursor:pointer}
.prog-pct-disp{font-size:1.1rem;font-weight:700;text-align:right}
.btn-remove{width:32px;height:32px;background:#fff;border:1px solid #d0d0cc;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-remove:hover{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.btn-add{padding:.5rem 1rem;background:transparent;border:1px solid #d0d0cc;font-size:.62rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:.5rem}
.btn-add:hover{border-color:#0a0a0a;background:#0a0a0a;color:#fff}
.nov-item{display:grid;grid-template-columns:130px 1fr 32px;gap:.6rem;align-items:start;margin-bottom:.6rem}
.drop-zone{border:2px dashed #d0d0cc;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1rem;position:relative}
.drop-zone:hover,.drop-zone.over{border-color:#F5C000;background:#fffdf0}
.drop-label{font-size:.78rem;color:#888}
.drop-label strong{color:#0a0a0a}
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.75rem}
.foto-card{position:relative;background:#f4f4f2;border:1px solid #e0e0dc}
.foto-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto-card-overlay{position:absolute;top:.4rem;right:.4rem}
.btn-del{background:rgba(255,107,107,.9);color:#fff;border:none;padding:.25rem .5rem;font-size:.6rem;font-weight:700;cursor:pointer}
.foto-caption{width:100%;padding:.35rem .4rem;font-size:.6rem;border:none;border-top:1px solid #e0e0dc;background:#fff;font-family:inherit;outline:none}
.prog-bar{height:3px;background:#d0d0cc;margin:.5rem 0;display:none;overflow:hidden;border-radius:2px}
.prog-bar-fill{height:100%;background:#F5C000;width:0;transition:width .2s}
.fin-item{display:grid;grid-template-columns:1fr 130px auto 32px;gap:.6rem;align-items:center;margin-bottom:.6rem}
.cb-label{display:flex;align-items:center;gap:.35rem;font-size:.75rem;cursor:pointer;white-space:nowrap}
.cb-label input{accent-color:#F5C000}
#preview-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;flex-direction:column}
#preview-modal.open{display:flex}
.preview-topbar{background:#0a0a0a;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #F5C000;flex-shrink:0}
.preview-topbar-title{color:#F5C000;font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
#preview-body{flex:1;overflow-y:auto;background:#fafafa;padding:2rem}
#preview-inner{max-width:860px;margin:0 auto}
#pub-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.75);z-index:500;align-items:center;justify-content:center}
#pub-overlay.show{display:flex}
.pub-box{background:#fff;padding:2.5rem 3rem;text-align:center;border-top:3px solid #F5C000;min-width:240px}
.pub-spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#F5C000;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.pub-msg{font-size:.8rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.toast{position:fixed;bottom:2rem;right:2rem;background:#0a0a0a;color:#fff;padding:.9rem 1.5rem;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;border-left:3px solid #F5C000;opacity:0;transform:translateY(8px);transition:all .3s;z-index:9999;pointer-events:none;max-width:320px}
.toast.show{opacity:1;transform:translateY(0)}
.foto-uploading{opacity:.5;position:relative}
.foto-uploading::after{content:'Subiendo...';position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
@media(max-width:860px){.main-layout{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}.fotos-grid{grid-template-columns:repeat(2,1fr)}.fin-item{grid-template-columns:1fr 110px}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Bacacay <span>2784</span></div>
    <div class="login-sub">Panel de administración</div>
    <label class="login-label">Email</label>
    <input class="login-input" type="email" id="l-email" placeholder="tu@email.com"/>
    <label class="login-label">Contraseña</label>
    <input class="login-input" type="password" id="l-pass" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="l-err">Email o contraseña incorrectos.</div>
  </div>
</div>

<div id="admin-ui">
  <div class="topbar">
    <div class="topbar-logo">Bacacay <span>2784</span> — Admin</div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="index.html" class="btn-sm btn-white" target="_blank">Ver landing ↗</a>
      <button class="btn-sm btn-white" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-title">Informes</div>
        <ul class="report-list" id="report-list"></ul>
      </div>
      <button class="btn-new" onclick="newReport()">+ Nuevo informe</button>
    </aside>
    <main class="content" id="content">
      <div style="text-align:center;padding:4rem 0;color:#aaa">
        <div style="font-size:2rem;margin-bottom:.75rem">📋</div>
        <div style="font-size:.88rem">Seleccioná un informe o creá uno nuevo</div>
      </div>
    </main>
  </div>
</div>

<div id="preview-modal">
  <div class="preview-topbar">
    <span class="preview-topbar-title">Vista previa — como lo ve el cliente</span>
    <div style="display:flex;gap:.6rem">
      <button class="btn-sm btn-yellow" onclick="publishFromPreview()">✓ Publicar</button>
      <button class="btn-sm btn-white" onclick="closePreview()">✕ Cerrar</button>
    </div>
  </div>
  <div id="preview-body"><div id="preview-inner"></div></div>
</div>

<div id="pub-overlay">
  <div class="pub-box">
    <div class="pub-spinner"></div>
    <div class="pub-msg" id="pub-msg">Publicando...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>

// ── AUTH ──────────────────────────────────────────────────────────────────────
function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(u => {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-ui').style.display = 'block';
      document.getElementById('topbar-user').textContent = u.user.email;
      loadReports();
    })
    .catch(() => { document.getElementById('l-err').style.display = 'block'; });
}
function doLogout(){ auth.signOut().then(()=>location.reload()); }

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadReports(){
  try {
    const snap = await db.collection('reports').orderBy('createdAt','asc').get();
    allReports = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderSidebar();
    if(allReports.length) selectReport(allReports[allReports.length-1].id);
  } catch(e){ toast('Error: '+e.message); }
}

function renderSidebar(){
  document.getElementById('report-list').innerHTML = allReports.map(r=>`
    <li class="rli ${r.id===currentId?'active':''}" onclick="selectReport('${r.id}')">
      <div class="rli-num">#${String(r.numero||0).padStart(3,'0')}</div>
      <div class="rli-title">${esc(r.titulo||'Sin título')}</div>
      <div class="rli-date">${esc(r.fecha||'Sin fecha')}</div>
    </li>`).join('');
}

// ── SELECT ────────────────────────────────────────────────────────────────────
async function selectReport(id){
  currentId = id;
  renderSidebar();
  const r = allReports.find(x=>x.id===id);

  // Cargar fotos desde subcolección
  currentFotos = [];
  try {
    const fsnap = await db.collection('reports').doc(id)
      .collection('fotos').orderBy('order','asc').get();
    fsnap.docs.forEach(d=>{
      currentFotos.push({ id:d.id, src:d.data().src, caption:d.data().caption||'', order:d.data().order||0, isNew:false, toDelete:false });
    });
  } catch(e){ console.warn('fotos load:', e); }

  // Hero y axo desde el doc principal (guardados como base64 en campo)
  currentHeroB64 = r.heroB64 || null;
  currentAxoB64  = r.axoB64  || null;

  renderForm(r);
}

// ── NEW REPORT ────────────────────────────────────────────────────────────────
async function newReport(){
  const last = allReports.length ? allReports[allReports.length-1] : null;
  const num  = last ? (last.numero||0)+1 : 0;
  const draft = {
    numero: num,
    titulo: `Informe Nº ${num}`,
    fecha: '', etapa: last?.etapa||'',
    pctGlobal: last?.pctGlobal||0,
    clima:{ texto:'Días lluvia: 0', sub:'Sin impacto' },
    progreso: last?.progreso ? last.progreso.map(p=>({...p})) : [
      {nombre:'Tareas Preliminares',val:0,nota:''},
      {nombre:'Estructura',val:0,nota:''},
      {nombre:'Albañilería',val:0,nota:''},
      {nombre:'Instalaciones',val:0,nota:''},
    ],
    galeriaTitle:'Lo que está sucediendo en obra',
    novedades:[{fecha:'',texto:''}],
    financiero: last?.financiero ? JSON.parse(JSON.stringify(last.financiero))
      : {pagadoPct:0,pagado:'$0',pendiente:'$0',total:'$0',items:[],hito:''},
    proximoInforme:'', heroB64:null, axoB64:null,
    superficieTotal: last?.superficieTotal||750,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  const ref = await db.collection('reports').add(draft);
  draft.id = ref.id;
  allReports.push(draft);
  currentFotos = []; currentHeroB64 = null; currentAxoB64 = null;
  currentId = ref.id;
  renderSidebar();
  renderForm(draft);
  toast('Nuevo informe creado');
}

// ── FOTOS ─────────────────────────────────────────────────────────────────────
function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('over');
  handleFotoFiles(e.dataTransfer.files);
}

async function handleFotoFiles(files){
  const arr=Array.from(files); if(!arr.length) return;
  const bar=document.getElementById('foto-bar');
  const fill=document.getElementById('foto-fill');
  bar.style.display='block';
  for(let i=0;i<arr.length;i++){
    fill.style.width=((i/arr.length)*90)+'%';
    const compressed = await compressImage(arr[i], 1000, 78);
    const order = currentFotos.length;
    currentFotos.push({ id:null, src:compressed, caption:arr[i].name.replace(/\.[^.]+$/,''), order, isNew:true, toDelete:false });
    renderFotosGrid();
  }
  fill.style.width='100%';
  setTimeout(()=>{bar.style.display='none';fill.style.width='0';},500);
  toast(`${arr.length} foto${arr.length>1?'s':''} lista${arr.length>1?'s':''} para publicar`);
}

function renderFotosGrid(){
  const grid=document.getElementById('fotos-grid'); if(!grid) return;
  const visible=currentFotos.filter(f=>!f.toDelete);
  grid.innerHTML=visible.map((f,vi)=>{
    const realIdx=currentFotos.indexOf(f);
    return `<div class="foto-card">
      <img src="${f.src}" alt="${esc(f.caption)}"/>
      <div class="foto-card-overlay"><button class="btn-del" onclick="removeFoto(${realIdx})">✕</button></div>
      <input class="foto-caption" id="fc-${realIdx}" value="${esc(f.caption)}" placeholder="Caption"/>
    </div>`;
  }).join('');
}

function removeFoto(i){
  if(currentFotos[i].id){
    currentFotos[i].toDelete=true; // marcar para borrar en Firestore
  } else {
    currentFotos.splice(i,1);
  }
  renderFotosGrid();
}

async function handleAxo(input){
  const f=input.files[0]; if(!f) return;

  else {

    const wrap=document.getElementById('axo-file').closest('.fs');

      const prev=wrap.querySelector('img[style*="300px"]');

    }

function showBar(id){ const b=document.getElementById(id+'-bar'),f=document.getElementById(id+'-fill'); b.style.display='block'; f.style.width='55%'; }
function hideBar(id){ const b=document.getElementById(id+'-bar'),f=document.getElementById(id+'-fill'); f.style.width='100%'; setTimeout(()=>{b.style.display='none';f.style.width='0';},400); }

// ── COMPRESS ──────────────────────────────────────────────────────────────────
function compressImage(file,maxW,q){
  return new Promise(resolve=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const ratio=Math.min(maxW/img.width,1);
      const c=document.createElement('canvas');
      c.width=img.width*ratio; c.height=img.height*ratio;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',q/100));
    };
    img.src=url;
  });
}

// ── COLLECT ───────────────────────────────────────────────────────────────────
function collectData(){
  // actualizar captions
  currentFotos.forEach((f,i)=>{ const el=document.getElementById('fc-'+i); if(el) f.caption=el.value; });

  const progreso=[];
  document.querySelectorAll('[id^="pi-"]').forEach(row=>{
    const i=row.id.replace('pi-','');
    progreso.push({ nombre:document.getElementById('p-nom-'+i)?.value||'', val:parseInt(document.getElementById('p-val-'+i)?.value||0), nota:document.getElementById('p-nota-'+i)?.value||'' });
  });

  const novedades=[];
  document.querySelectorAll('[id^="ni-"]').forEach(row=>{
    const i=row.id.replace('ni-','');
    const txt=document.getElementById('nt-'+i)?.value||'';
    if(txt) novedades.push({ fecha:document.getElementById('nf-'+i)?.value||'', texto:txt });
  });

  const finItems=[];
  document.querySelectorAll('[id^="fii-"]').forEach(row=>{
    const i=row.id.replace('fii-','');
    const lbl=document.getElementById('fi-lbl-'+i)?.value||'';
    if(lbl) finItems.push({ label:lbl, valor:document.getElementById('fi-val-'+i)?.value||'', pagado:document.getElementById('fi-paid-'+i)?.checked||false });
  });

  return {
    titulo:   document.getElementById('f-titulo')?.value||'',
    fecha:    document.getElementById('f-fecha')?.value||'',
    etapa:    document.getElementById('f-etapa')?.value||'',
    pctGlobal:parseInt(document.getElementById('f-pct')?.value||0),
    clima:{ texto:document.getElementById('f-clima-txt')?.value||'', sub:document.getElementById('f-clima-sub')?.value||'' },
    superficieTotal:parseInt(document.getElementById('f-sup')?.value||750),
    proximoInforme: document.getElementById('f-proximo')?.value||'',
    galeriaTitle:   document.getElementById('f-gal')?.value||'',
    progreso, novedades,
    heroB64: currentHeroB64,
    axoB64:  currentAxoB64,
    financiero:{
      pagadoPct:parseInt(document.getElementById('fin-pct')?.value||0),
      total:    document.getElementById('fin-total')?.value||'',
      pagado:   document.getElementById('fin-pag')?.value||'',
      pendiente:document.getElementById('fin-pen')?.value||'',
      hito:     document.getElementById('fin-hito')?.value||'',
      items:    finItems,
    },
  };
}

// ── PUBLISH ───────────────────────────────────────────────────────────────────
async function publishReport(){ pendingData=collectData(); await doPublish(); }
async function publishFromPreview(){ closePreview(); await doPublish(); }

async function doPublish(){
  if(!currentId||!pendingData) return;
  const overlay=document.getElementById('pub-overlay');
  const msg=document.getElementById('pub-msg');
  overlay.classList.add('show');

  try {
    // 1. Guardar fotos nuevas en subcolección
    msg.textContent='Guardando fotos...';
    const batch=db.batch();
    const colRef=db.collection('reports').doc(currentId).collection('fotos');

    for(const f of currentFotos){
      if(f.isNew && !f.toDelete){
        const ref=colRef.doc();
        f.id=ref.id; f.isNew=false;
        batch.set(ref,{ src:f.src, caption:f.caption, order:f.order });
      }
      if(f.toDelete && f.id){
        batch.delete(colRef.doc(f.id));
      }
      if(!f.isNew && !f.toDelete && f.id){
        // actualizar caption si cambió
        batch.update(colRef.doc(f.id),{ caption:f.caption, order:f.order });
      }
    }
    await batch.commit();

    // Limpiar marcados para borrar
    currentFotos=currentFotos.filter(f=>!f.toDelete);

    // 2. Guardar doc principal (sin fotos base64 — van en subcolección)
    msg.textContent='Publicando informe...';
    const data={
      ...pendingData,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    await db.collection('reports').doc(currentId).update(data);

    const idx=allReports.findIndex(r=>r.id===currentId);
    if(idx>=0) allReports[idx]={...allReports[idx],...data};

    msg.textContent='✓ Publicado';
    setTimeout(()=>{
      overlay.classList.remove('show');
      renderSidebar();
      renderFotosGrid();
      toast('✓ Informe publicado correctamente');
      updateWaBtn();
    },700);

  } catch(e){
    overlay.classList.remove('show');
    toast('Error: '+e.message);
    console.error(e);
  }
}

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function updateWaBtn(){
  const btn=document.getElementById('wa-btn'); if(!btn) return;
  const r=allReports.find(x=>x.id===currentId)||{};
  const url=window.location.href.replace('admin.html','index.html');
  const msg=encodeURIComponent(`🏗 Nuevo informe de avance — Bacacay 2784\n${r.titulo||''} · ${r.fecha||''}\nAvance global: ${r.pctGlobal||0}%\n\nVerlo acá: ${url}`);
  btn.href=`https://wa.me/?text=${msg}`;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }
